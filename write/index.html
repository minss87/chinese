<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한자 쓰기">
<title>한자 쓰기 · 金老师의 베이징 일기</title>
<style>
@font-face{font-family:"Pretendard";font-style:normal;font-weight:100 500;font-display:swap;
  src:url("../fonts/Pretendard-Regular.woff2") format("woff2");}
@font-face{font-family:"Pretendard";font-style:normal;font-weight:600 900;font-display:swap;
  src:url("../fonts/Pretendard-Bold.woff2") format("woff2");}
/* 한자 손글씨체 — 이 파일만 바꾸면 글씨체가 전부 바뀐다 */
@font-face{font-family:"HandZh";src:url("../fonts/HandZh.woff2") format("woff2");font-display:swap;}

/* ── 팔레트 : 쿨 화이트 ── */
:root{
  --bg:#f4f6f9; --sheet:#ffffff; --ink:#0f1728; --ink2:#566074; --ink3:#97a0b0;
  --hair:#e2e6ed; --hair2:#edf0f4; --accent:#2563eb; --accent2:#e5322a;
  --pick:#e8efff; --gridline:#d5dbe5; --mark:rgba(255,214,10,.45);
  --prim:#2563eb; --primink:#ffffff; --btn:#ffffff; --btnhold:#0f1728;
  --ok:#16a34a; --okbg:#e8f7ee; --bad:rgba(229,50,42,.08); --badline:rgba(229,50,42,.45);
  --shadow:0 1px 2px rgba(15,23,40,.05),0 6px 18px rgba(15,23,40,.06);
  --model:#0f1728; --pen:#0f1728;
}
:root[data-theme="dark"]{
  --bg:#0e131c; --sheet:#171e2a; --ink:#eef2f8; --ink2:#a3adbd; --ink3:#6b7587;
  --hair:#253043; --hair2:#1b2331; --accent:#6f9bff; --accent2:#ff6b60;
  --pick:#1c2a44; --gridline:#2f3b50; --mark:rgba(255,214,10,.3);
  --prim:#6f9bff; --primink:#0b1220; --btn:#1b2331; --btnhold:#eef2f8;
  --ok:#4ade80; --okbg:rgba(74,222,128,.14); --bad:rgba(255,107,96,.12); --badline:rgba(255,107,96,.45);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --model:#eef2f8; --pen:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{margin:0;background:var(--bg);color:var(--ink);letter-spacing:-.011em;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font:15px/1.5 "Pretendard",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;}
.zh{font-family:"HandZh","PingFang SC","Noto Sans CJK SC",serif;}
/* 펜슬 입력을 사파리가 가로채지 못하게 — 선택·돋보기·확대를 전부 끈다 */
button{touch-action:manipulation;font-family:inherit;}
input,textarea{-webkit-user-select:text;user-select:text;touch-action:manipulation;}
.epbar{touch-action:pan-x;}
.chips,.slist,.textwrap,.relist,.sheetbody{touch-action:pan-y;}
svg{display:block;}
#app{height:100%;display:flex;flex-direction:column;}
.cap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink3);}
.muted,.hintline{font-size:13px;color:var(--ink3);}
.spacer{flex:1;}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;}

/* ── 1행 : 탭 ── */
.tabs{flex:none;height:60px;display:flex;align-items:stretch;gap:4px;padding:6px 22px 0;
  background:var(--sheet);border-bottom:1px solid var(--hair);}
.mode{background:none;border:0;font:inherit;font-size:16px;color:var(--ink3);padding:0 16px;min-width:92px;
  cursor:pointer;position:relative;}
.mode.on{color:var(--ink);font-weight:700;}
.mode.on:after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent);}
.seg{display:flex;align-items:center;background:var(--hair2);border-radius:12px;padding:4px;margin:6px 0 12px;}
.seg-b{border:0;background:none;font:inherit;font-size:14px;color:var(--ink2);height:36px;padding:0 16px;border-radius:9px;cursor:pointer;}
.seg-b.on{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(15,23,40,.1);}
.gear{width:48px;height:48px;margin:0 0 6px 6px;align-self:center;border:0;background:none;border-radius:12px;
  color:var(--ink2);display:grid;place-items:center;cursor:pointer;}
.gear svg{width:23px;height:23px;}
.gear.on{background:var(--hair2);color:var(--ink);}

/* ── 2행 : 화 선택 ── */
.epbar{flex:none;height:60px;display:flex;align-items:center;gap:4px;padding:0 22px;
  background:var(--sheet);border-bottom:1px solid var(--hair);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
.epbar::-webkit-scrollbar{display:none;}
.epbtn{flex:none;height:42px;padding:0 15px;border:0;background:none;border-radius:12px;font:inherit;font-size:14.5px;
  color:var(--ink3);white-space:nowrap;cursor:pointer;}
.epbtn.done{color:var(--ink2);}
.epbtn.done:after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);
  margin-left:6px;vertical-align:middle;}
.epbtn.on{background:var(--ink);color:var(--sheet);font-weight:600;}
.epbtn.on:after{background:var(--sheet);opacity:.55;}
.epbtn.flag{color:var(--accent2);}
.epbtn.flag.on{background:var(--accent2);color:#fff;}
.prog{flex:none;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);white-space:nowrap;
  font-variant-numeric:tabular-nums;padding-left:12px;}
.prog .bar{width:96px;height:5px;background:var(--hair2);border-radius:5px;overflow:hidden;}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:5px;}

/* ── 3행 : 글자 정보 ── */
.head{flex:none;min-height:84px;display:flex;align-items:center;gap:18px;padding:12px 22px 4px 124px;}
.head.norail{padding-left:22px;}
.hbig{font-size:56px;line-height:1;}
.hpy{font-size:23px;color:var(--accent2);font-weight:700;}
.hword{font-size:19px;}
.hen{font-size:13.5px;color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hlead{font-size:21px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;line-height:1.35;}
.hlead.zh{font-size:24px;font-weight:400;}
.hlead.dim{color:var(--ink3);font-weight:500;}
.hcap{display:flex;flex-direction:column;gap:2px;flex:none;}
.gline{display:flex;align-items:center;gap:12px;flex:1;}
.gauge{display:flex;gap:5px;}
.gauge i{width:24px;height:4px;border-radius:4px;background:var(--hair);display:block;flex:none;}
.gauge i.d{background:var(--ink);} .gauge i.c{background:var(--accent);}

/* 손가락 버튼 — 최소 56 */
.btn{height:56px;min-width:56px;border:1px solid var(--hair);background:var(--btn);border-radius:16px;
  font:inherit;font-size:15px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;
  gap:8px;padding:0 18px;cursor:pointer;flex:none;white-space:nowrap;}
.btn svg{width:22px;height:22px;flex:none;}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);}
.btn.on{background:var(--pick);border-color:transparent;color:var(--accent);font-weight:600;}
.btn.icon{width:56px;padding:0;}
.btn[disabled]{opacity:.35;cursor:default;}
.btn:active{transform:scale(.97);}

/* ── 본문 : 레일 | 작업 | 이동 ── */
.body{flex:1;min-height:0;display:flex;gap:22px;padding:12px 22px 20px;}
.rail{width:80px;flex:none;display:flex;flex-direction:column;gap:10px;justify-content:center;}
.rbtn{width:80px;height:76px;border:1px solid var(--hair);background:var(--btn);border-radius:20px;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:inherit;font-size:12px;
  cursor:pointer;flex:none;}
.rbtn svg{width:26px;height:26px;}
.rbtn:active{transform:scale(.96);}
.rbtn.hold{height:140px;border-radius:24px;touch-action:none;}
.rbtn.penbtn{height:84px;gap:4px;}
.rbtn.penbtn canvas{width:58px;height:30px;display:block;}
.rbtn.penbtn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
/* ── 펜 팔레트 ── */
.penpal{position:fixed;z-index:25;width:352px;background:var(--sheet);border:1px solid var(--hair);border-radius:24px;
  box-shadow:0 18px 50px rgba(15,23,40,.22);padding:16px 16px 18px;display:none;touch-action:none;}
.penpal.open{display:block;}
.pp-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pp-type{height:104px;border:1px solid var(--hair);background:var(--btn);border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer;padding:0;}
.pp-type canvas{width:78px;height:40px;display:block;}
.pp-type.on{border-color:var(--accent);background:var(--pick);color:var(--accent);font-weight:700;box-shadow:0 0 0 1px var(--accent) inset;}
.pp-row{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 8px;}
.pp-row b{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600;}
.pp-slider{position:relative;height:60px;touch-action:none;cursor:pointer;}
.pp-slider canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}
.pp-thumb{position:absolute;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--sheet);
  border:2px solid var(--accent);box-shadow:0 2px 8px rgba(15,23,40,.25);pointer-events:none;}
.pp-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin:2px 4px 0;}
.pp-preview{display:block;width:100%;height:92px;margin-top:14px;border-radius:14px;background:var(--bg);}
.rbtn.hold small{font-size:10.5px;color:var(--ink3);line-height:1.3;text-align:center;}
.rbtn.hold.on{background:var(--btnhold);border-color:var(--btnhold);color:var(--sheet);}
.rbtn.hold.on small{color:var(--sheet);opacity:.75;}
.rbtn.hold.lock{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.rbtn.hold.lock small{color:#fff;opacity:.85;}
.hwcell{touch-action:none;}
.rgap{height:8px;flex:none;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.nav{width:136px;flex:none;display:flex;flex-direction:column;gap:10px;justify-content:flex-end;}
.nav .btn{width:100%;}
.nav .big{height:196px;border-radius:26px;flex-direction:column;gap:12px;font-size:16px;font-weight:700;
  background:var(--prim);border-color:var(--prim);color:var(--primink);white-space:normal;text-align:center;line-height:1.3;}
.nav .big svg{width:36px;height:36px;}
.nav .big.ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.nav .big[disabled]{opacity:.3;}

/* 쓰는 칸 */
.cellwrap-row{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
.cells{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  background:var(--sheet);border:1px solid var(--hair);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.cellwrap{position:relative;display:grid;place-items:center;min-width:0;min-height:0;}
.cellwrap:nth-child(-n+2){border-bottom:1px solid var(--hair);}
.cellwrap:nth-child(odd){border-right:1px solid var(--hair);}
.cell{display:block;touch-action:none;background:transparent;-webkit-user-select:none;user-select:none;}
.tagline{position:absolute;top:10px;left:13px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;pointer-events:none;}
.erasing .cell,.erasing .note{cursor:cell;}

/* 획순 */
.hwrow{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:22px;}
.hwcell{position:relative;overflow:hidden;flex:none;background:var(--sheet);border:1px solid var(--hair);
  border-radius:14px;box-shadow:var(--shadow);
  background-image:
    repeating-linear-gradient(to bottom, var(--gridline) 0 5px, transparent 5px 11px),
    repeating-linear-gradient(to right, var(--gridline) 0 5px, transparent 5px 11px);
  background-size:1px 86%,86% 1px;background-position:center center,center center;background-repeat:no-repeat,no-repeat;}
.hwcell svg{display:block;}

/* 받아쓰기 공책 */
.notewrap{flex:1;min-height:0;display:flex;}
.note{flex:1;display:block;border-radius:14px;touch-action:none;background:var(--sheet);border:1px solid var(--hair);box-shadow:var(--shadow);}
.answer{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 4px 0;}
.ans-zh{font-size:28px;font-family:"HandZh","PingFang SC",serif;}
.ans-py{font-size:14px;color:var(--accent2);}

/* 읽기 */
.textwrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:14px 10px;background:var(--sheet);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);}
.ttitle{margin:0 0 14px;text-align:center;}
.ttitle .sc-h{font-size:34px;font-weight:700;}
.tline{margin:0;text-align:center;}
.tline .sc-h{font-size:28px;}
.tline .sc-py,.ttitle .sc-py{min-height:0;font-size:0;}
.sent{margin:0;text-align:center;line-height:1.35;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;}
.sent.hide .sc-h{color:transparent;text-shadow:0 0 22px rgba(15,23,40,.45);}
[data-theme="dark"] .sent.hide .sc-h{text-shadow:0 0 22px rgba(255,255,255,.45);}
.sc{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;padding:0 2px;border-radius:6px;}
.sc.pn{cursor:default;padding:0;margin-left:-.12em;}
.sc.hard{background:var(--mark);}
.sc-py{font-size:15px;line-height:1.4;color:var(--accent2);font-weight:600;min-height:21px;}
.sc-h{font-size:48px;font-weight:400;line-height:1.15;font-family:"HandZh","PingFang SC",serif;}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  background:var(--sheet);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);padding:20px;}
.sentwrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
.qkind{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent2);}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px;}
.opt{min-height:60px;border:1px solid var(--hair);background:var(--btn);color:var(--ink);font:inherit;font-size:16px;
  text-align:left;padding:14px 18px;border-radius:16px;cursor:pointer;line-height:1.4;}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600;}
.opt.wrong{border-color:var(--badline);background:var(--bad);}
.opt.dim{opacity:.4;}
.reveal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;max-width:640px;}
.rv-k{font-size:16px;font-weight:600;flex:1;min-width:0;}
.rv-w{font-size:13px;color:var(--ink3);}
.newrow{display:flex;gap:18px;flex-wrap:wrap;padding:14px 4px 0;}
.nch{font-size:14px;color:var(--ink2);}
.nch b{font-size:21px;margin-right:6px;font-family:"HandZh","PingFang SC",serif;color:var(--ink);font-weight:400;}
.gradebox{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 4px 0;}
.gsc{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink2);}
.gsc b{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
.gsc.ai b{color:var(--accent);}
.gsub{font-size:13px;color:var(--ink3);}
.gsub.err{color:var(--accent2);}
.gtip{margin:4px 4px 0;font-size:14px;color:var(--ink2);}
.gtip.good{color:var(--ink);font-weight:600;}
.result{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--hair);
  border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;}
.rs-row{display:flex;gap:44px;padding:0 0 16px;}
.rs-big{font-size:40px;font-weight:700;margin:0;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.relist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;}
.rerow{display:flex;align-items:baseline;gap:14px;text-align:left;width:100%;cursor:pointer;min-height:56px;
  border:0;border-top:1px solid var(--hair2);background:none;padding:14px 4px;font:inherit;color:var(--ink);}
.rr-h{font-size:22px;font-family:"HandZh","PingFang SC",serif;}
.rr-p{font-size:13px;color:var(--accent2);}
.rr-k{font-size:13px;color:var(--ink3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hardrow{margin:12px 0 0;font-size:14px;color:var(--ink2);}
.hardrow b{font-size:21px;font-family:"HandZh","PingFang SC",serif;background:var(--mark);border-radius:5px;
  padding:2px 6px;color:var(--ink);font-weight:400;}

/* ── 팝업 : 설정 / 목록 ── */
.scrim{position:fixed;inset:0;background:rgba(15,23,40,.28);z-index:20;}
.sheet{position:fixed;z-index:21;background:var(--sheet);border-radius:22px;box-shadow:0 20px 60px rgba(15,23,40,.25);
  display:flex;flex-direction:column;overflow:hidden;}
.sheet.set{top:66px;right:18px;width:360px;}
.sheet.list{top:74px;right:18px;bottom:18px;width:430px;}
.sheethead{display:flex;align-items:center;padding:14px 12px 10px 22px;border-bottom:1px solid var(--hair2);}
.sheethead b{font-size:17px;flex:1;}
.sheetbody{padding:16px 22px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;}
.setrow{display:flex;flex-direction:column;gap:8px;}
.setrow .seg{margin:0;align-self:flex-start;}
.setrow .seg-b{height:44px;padding:0 18px;font-size:15px;}
.keybox{display:flex;gap:8px;}
.keybox .input{flex:1;min-width:0;height:52px;border:1px solid var(--hair);background:var(--bg);border-radius:14px;
  padding:0 14px;font:inherit;font-size:15px;color:var(--ink);}
.foot{margin:0;font-size:12px;color:var(--ink3);}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.chip{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:24px;border:1px solid var(--hair);
  background:var(--btn);color:var(--ink2);cursor:pointer;padding:0;}
.chip.done{background:var(--pick);border-color:transparent;color:var(--accent);}
.chip.now{background:var(--ink);border-color:var(--ink);color:var(--sheet);}
.chip.flag{box-shadow:inset 0 0 0 2px var(--accent2);}
.slist{display:flex;flex-direction:column;gap:6px;}
.srow{display:flex;align-items:center;gap:12px;min-height:60px;border:1px solid var(--hair);background:var(--btn);
  border-radius:16px;font:inherit;text-align:left;cursor:pointer;padding:10px 16px;color:var(--ink);}
.srow .n{font-size:12px;font-weight:700;color:var(--ink3);min-width:18px;}
.srow .t{flex:1;min-width:0;font-size:14.5px;line-height:1.4;}
.srow.done .n{color:var(--accent);}
.srow.on{background:var(--ink);border-color:var(--ink);color:var(--sheet);} .srow.on .n{color:var(--sheet);opacity:.6;}

.spin{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;
  border:2px solid var(--hair);border-top-color:var(--ink2);animation:sp .7s linear infinite;margin-right:7px;}
@keyframes sp{to{transform:rotate(360deg);}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);
  color:var(--sheet);font-size:14px;padding:12px 20px;border-radius:999px;z-index:30;}
.rotate{display:none;}
@media (orientation:portrait) and (max-width:900px){
  .rotate{display:flex;position:fixed;inset:0;z-index:40;background:var(--bg);
    align-items:center;justify-content:center;text-align:center;padding:40px;font-size:17px;color:var(--ink2);}
}
</style>
</head>
<body>
<div id="app"><div class="body"><div class="side"><p class="sub">불러오는 중</p></div></div></div>
<div class="rotate">가로로 돌려주세요</div>

<script src="./hanzi-writer.min.js"></script>
<script>
"use strict";

/* ===================== 저장 ===================== */

/* 회화앱에서 약했던 문장 → 약한 글자 */

function epChars(w) {
  var seen = {}, out = [];
  w.sessions.forEach(function (sess) {
    sess.target_vocab.forEach(function (v) {
      hanziChars(v.hanzi).forEach(function (c) {
        if (seen[c]) return;
        seen[c] = 1;
        out.push({ ch: c, word: v.hanzi, wordPinyin: v.pinyin, en: v.en || "",
          ex: v.example || null });

    });
  });

  var seen = {};

    ph.weeks.forEach(function (w) {
      w.sessions.forEach(function (sess) {
        sess.target_vocab.forEach(function (v) {
          hanziChars(v.hanzi).forEach(function (c) {
            if (!want[c] || seen[c]) return;
            seen[c] = 1;
            out.push({ ch: c, word: v.hanzi, wordPinyin: v.pinyin, en: v.en || "", ex: v.example || null });

  function pt(ev) {
    var r = pad.rect;
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  /* 사파리의 손글씨 인식(Scribble)·선택·돋보기·더블탭 확대가 펜슬 획을 가로채지 못하게
     터치 이벤트의 기본 동작을 막는다. 포인터 이벤트는 그대로 들어온다 */
  ["touchstart", "touchmove", "touchend"].forEach(function (t) {
    canvas.addEventListener(t, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  });

  if (opt.readonly) { pad.readonly = true; return pad; }    /* 본보기 칸 : 보기만 한다 */

  canvas.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (!allowDraw(ev)) return;                             /* 손바닥 · 펜슬 전용일 때 손가락 */
    if (pad.cur) end();                                     /* 놓친 pointerup 이 있으면 먼저 마무리 */
    pad.pid = ev.pointerId;
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    pad.rect = canvas.getBoundingClientRect();
    pad.ink = ink("pen");
    var p = pt(ev);
    if (S.erase || ev.pointerType === "eraser" || ev.buttons === 32) {
      if (holdPid !== null) holdUsed = true;
      p.w = 1; p.a = 1;
      pad.cur = { pts: [p], erase: true };
      if (!eraseAt(p)) pad.redraw();
      pad.eraseRing(p);
      return;
    }
    var st = { pts: [p], erase: false, pen: penType(), seed: (Math.random() * 1e9) | 0 };
    st.base = penBase(unit(), st.pen);
    var q0 = penPoint(st, { pointerType: ev.pointerType, pressure: ev.pressure, x: p.x, y: p.y }, null, st.base, 0);
    p.w = q0.w; p.a = q0.a; p.pr = q0.pr;
    pad.cur = st;
    dot(st);
  }, { passive: false });

  canvas.addEventListener("pointermove", function (ev) {
    /* 펜슬을 띄운 채 움직일 때(호버) : 지우개 범위를 미리 보여 준다 */
    if (!pad.cur) {
      if (ev.pointerType === "pen" && !ev.buttons && S.erase) {
        pad.rect = pad.rect || canvas.getBoundingClientRect();
        pad.redraw(); pad.eraseRing(pt(ev), true); pad.hovering = true;
      }
      return;
    }
    if (ev.pointerId !== pad.pid) return;
    ev.preventDefault();
    /* 사파리는 캡처 중에 빈 배열을 돌려줄 때가 있다 — 비면 이벤트 자체를 쓴다 */
    var list = ev.getCoalescedEvents ? ev.getCoalescedEvents() : null;
    if (!list || !list.length) list = [ev];
    if (pad.cur.erase) {
      var q = pt(ev);
      if (!eraseAt(q)) pad.redraw();
      pad.eraseRing(q);
      return;
    }
    var pts = pad.cur.pts;
    for (var i = 0; i < list.length; i++) {
      var e = list[i], p = pt(e), prev = pts[pts.length - 1];
      if (Math.hypot(p.x - prev.x, p.y - prev.y) < 0.7) continue;
      var sp = e.pressure > 0 ? prev.pr + (e.pressure - prev.pr) * 0.35 : prev.pr;
      var q = penPoint(pad.cur, { pointerType: e.pointerType, pressure: sp, x: p.x, y: p.y }, prev, pad.cur.base, pts.length);
      p.w = q.w; p.a = q.a; p.pr = q.pr;
      pts.push(p);
      drawTail(pad.cur);                                    /* 새 구간만 그린다 */
    }
  }, { passive: false });

  canvas.addEventListener("pointerleave", function (ev) {
    if (pad.hovering && !pad.cur) { pad.hovering = false; pad.redraw(); }
  });

  function end() {
    if (!pad.cur) return;
    var st = pad.cur;
    pad.cur = null;
    if (st.erase) { pad.redraw(); return onDraw(pad); }
    if (st.pen === "brush" && st.pts.length > 3) {
      var n = st.pts.length, k = Math.min(6, n - 1);
      for (var i = 0; i < k; i++) st.pts[n - 1 - i].w *= 0.28 + 0.72 * (i / k);
      pad.strokes.push(st);
      pad.redraw();
    } else {
      drawEnd(st);
      pad.strokes.push(st);
    }
    strokeLog.push(pad);                                  /* 되돌리기는 쓴 순서대로 */
    onDraw(pad);
  }
  function endIf(ev) { if (ev.pointerId === pad.pid) end(); }
  canvas.addEventListener("pointerup", endIf);
  canvas.addEventListener("pointercancel", endIf);
  canvas.addEventListener("lostpointercapture", endIf);
  return pad;
}

function onDraw(pad) {}

/* ===================== 읽기 (해독) ===================== */
var READ_N = 12;                       /* 한 세트 문제 수 */
var FLASH_MS = 2500;
var zhVoice = null;
function pickVoice() {
  var vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  zhVoice = vs.filter(function (v) { return /^zh[-_]?(CN|Hans)?/i.test(v.lang); })[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = rate || 0.95;
  if (zhVoice) u.voice = zhVoice;
  speechSynthesis.speak(u);
}

function rkey(zh) { return "r:" + zh; }
function readState(zh) { return W.read[rkey(zh)] || null; }
function koTag(ko) { var m = /^\[([^\]]+)\]\s*/.exec(ko || ""); return m ? m[1] : "나"; }
function koBody(ko) { return String(ko || "").replace(/^\[[^\]]+\]\s*/, ""); }
function shuffle(a) { return a.slice().sort(function () { return Math.random() - 0.5; }); }

/* 그 화의 예문 — 단어 순서대로 */
function epSentences(w) {
  var out = [], seen = {};
  w.sessions.forEach(function (sess) {
    sess.target_vocab.forEach(function (v) {
      var e = v.example;
      if (!e || !e.zh || seen[e.zh]) return;
      seen[e.zh] = 1;
      out.push({ zh: e.zh, pinyin: e.pinyin || "", ko: e.ko || "", word: v.hanzi });
    });
  });
  return out;
}
/* 회화앱에서 발음이 낮았던 문장 그대로 */
function weakSentences() {
  var t = talkData(); if (!t) return [];
  return Object.keys(t.missed || {}).map(function (k) {
    var m = t.missed[k] || {};
    return { zh: m.zh, pinyin: m.pinyin || "", ko: m.ko || "", word: "" };
  }).filter(function (x) { return x.zh; });
}
function epStrokeProgress(w) {
  var cs = epChars(w), d = 0;
  cs.forEach(function (c) { if (strokeDone(c.ch)) d++; });
  return { done: d, total: cs.length };
}
function epDictProgress(w) {
  var t = passage(W.ph, w);
  var ss = t ? t.lines : epSentences(w), d = 0;
  ss.forEach(function (x) { if (dictDone(x.zh)) d++; });
  return { done: d, total: ss.length };
}
function epReadProgress(w) {
  var t = passage(W.ph, w);
  var ss = t ? t.lines : epSentences(w), d = 0;
  ss.forEach(function (x) { var r = readState(x.zh); if (r && r.s === 2) d++; });
  return { done: d, total: ss.length };
}

/* ---- 문제 만들기 ---- */
/* 뜻 고르기: 오답은 같은 화에서, 글자가 겹치는 문장을 우선 고른다 */
function meanProblem(s, pool) {
  var mine = koBody(s.ko);
  var cand = pool.filter(function (x) { return x.zh !== s.zh && koBody(x.ko) !== mine; });
  var mych = {};
  hanziChars(s.zh).forEach(function (c) { mych[c] = 1; });
  cand = shuffle(cand).sort(function (a, b) {
    var sa = hanziChars(a.zh).filter(function (c) { return mych[c]; }).length;
    var sb = hanziChars(b.zh).filter(function (c) { return mych[c]; }).length;
    return sb - sa;
  }).slice(0, 3);
  if (cand.length < 3) return null;
  var opts = shuffle([mine].concat(cand.map(function (x) { return koBody(x.ko); })));
  return { kind: "mean", s: s, q: "이 문장은 무슨 뜻일까요", opts: opts, ans: opts.indexOf(mine) };
}
/* 누가 한 말일까: 화자 태그로 만든다 */
function whoProblem(s, pool) {
  var mine = koTag(s.ko), names = {};
  pool.forEach(function (x) { names[koTag(x.ko)] = 1; });
  var others = shuffle(Object.keys(names).filter(function (n) { return n !== mine; })).slice(0, 3);
  if (others.length < 2) return null;
  var opts = shuffle([mine].concat(others));
  return { kind: "who", s: s, q: "누가 한 말일까요", opts: opts, ans: opts.indexOf(mine) };
}

function buildProblems(pool) {
  /* 안 푼 문장 → 틀린 문장 → 맞힌 문장 순서 */
  var fresh = [], bad = [], good = [];
  pool.forEach(function (x) {
    var r = readState(x.zh);
    if (!r) fresh.push(x); else if (r.s < 2) bad.push(x); else good.push(x);
  });
  var order = shuffle(bad).concat(shuffle(fresh));
  if (!W.onlyNew || order.length < READ_N) order = order.concat(shuffle(good));
  var picked = order.slice(0, READ_N), out = [];
  /* 화자 맞히기는 이름표가 붙은 문장으로 — 안 붙은 문장은 답이 늘 '나'라 쉬워진다 */
  var tagged = picked.filter(function (x) { return /^\[/.test(x.ko || ""); });
  var plain = picked.filter(function (x) { return !/^\[/.test(x.ko || ""); });
  for (var i = 0; i < picked.length; i++) {
    var want = (i % 3 === 2), s0 = null, p = null;
    if (want && tagged.length) { s0 = tagged.shift(); p = whoProblem(s0, pool); }
    if (!p) {
      s0 = plain.length ? plain.shift() : tagged.shift();
      if (!s0) break;
      p = meanProblem(s0, pool) || whoProblem(s0, pool);
    }
    if (p) { p.flash = Math.random() < 0.35; out.push(p); }   /* 플래시는 무작위로 */
  }
  return out;
}

function passage(ph, w) { return RT[ph + ":" + w.week] || null; }
function allPassages() {
  var out = [];
  CUR.phases.forEach(function (p, pi) {
    p.weeks.forEach(function (w) { var t = passage(pi, w); if (t) out.push(t); });
  });
  return out;
}
/* 지문 문장으로 만든 뜻 고르기 + 마지막에 글 종류 고르기 */
function textProblems(t) {
  var pool = t.lines.map(function (l) {
    return { zh: l.zh, pinyin: l.pinyin, ko: l.ko, word: "" }; });
  var others = [];
  allPassages().forEach(function (x) {
    if (x !== t) x.lines.forEach(function (l) {
      others.push({ zh: l.zh, pinyin: l.pinyin, ko: l.ko, word: "" }); });
  });
  var qs = [];
  pool.forEach(function (sm) {
    var p = meanProblem(sm, pool.concat(shuffle(others).slice(0, 40)));
    if (p) qs.push(p);
  });
  var gs = {}, mine = t.genre;
  allPassages().forEach(function (x) { if (x.genre !== mine) gs[x.genre] = 1; });
  var others3 = shuffle(Object.keys(gs)).slice(0, 3);
  if (others3.length === 3) {
    var opts = shuffle([mine].concat(others3));
    qs.push({ kind: "genre", s: { zh: t.title, pinyin: t.titlePinyin, ko: t.titleKo },
      q: "이 글은 어떤 글일까요", opts: opts, ans: opts.indexOf(mine) });
  }
  qs.forEach(function (q) { q.flash = q.kind === "mean" && Math.random() < 0.35; });
  return qs;
}

function loadRead() {
  S.text = S.weak ? null : passage(W.ph, week());
  S.rd = S.text ? "text" : "quiz";
  S.newOpen = false;
  var pool = S.weak ? weakSentences() : epSentences(week());
  S.qs = S.text ? textProblems(S.text) : buildProblems(pool);
  S.idx = S.qs.length ? 0 : -2;        /* -2 = 문제 없음, -1 = 결과 */
  S.picked = -1; S.marks = [];
  S.shown = !flashNow(); S.t0 = Date.now();
  if (!S.shown) startFlash();
}

function flashNow() { var q = S.qs && S.qs[S.idx]; return !!(W.flash && q && q.flash); }
var flashT = null;
function startFlash() {
  clearTimeout(flashT);
  S.shown = true;
  flashT = setTimeout(function () {
    if (S.mode !== "read" || S.picked > -1) return;
    S.shown = false; render();
  }, FLASH_MS);
}

function answer(i) {
  var q = S.qs[S.idx];
  if (!q || S.picked > -1) return;
  clearTimeout(flashT);
  S.picked = i; S.shown = true;
  var ok = i === q.ans;
  var prev = readState(q.s.zh);
  W.read[rkey(q.s.zh)] = { s: ok ? 2 : 0, last: Date.now(), n: ((prev && prev.n) || 0) + 1 };
  S.marks.push({ zh: q.s.zh, ko: q.s.ko, pinyin: q.s.pinyin, ok: ok, kind: q.kind,
    sec: Math.round((Date.now() - S.t0) / 1000) });
  save(); render();
  if (ok) speak(q.s.zh);
}

function nextQ() {
  clearTimeout(flashT);
  if (S.idx + 1 < S.qs.length) {
    S.idx++; S.picked = -1; S.t0 = Date.now();
    S.shown = !flashNow(); if (!S.shown) startFlash();
  } else S.idx = -1;
  render();
}

/* ---- 형광펜: 모든 문제 화면에서 글자를 눌러 표시한다 ---- */
function markChar(c) {
  if (!/[一-鿿]/.test(c)) return;
  if (W.hard[c]) delete W.hard[c];
  else W.hard[c] = { n: ((W.hard[c] && W.hard[c].n) || 0) + 1, last: Date.now() };
  save(); render();
}
function hardList() {
  var seen = {}, out = [];
  var want = Object.keys(W.hard);
  if (!want.length) return out;
  want.forEach(function (c) { seen[c] = { ch: c, word: c, wordPinyin: "", en: "", ex: null }; });
  CUR.phases.forEach(function (ph) {
    ph.weeks.forEach(function (w) {
      w.sessions.forEach(function (sess) {
        sess.target_vocab.forEach(function (v) {
          hanziChars(v.hanzi).forEach(function (c) {
            if (seen[c] && !seen[c].wordPinyin)
              seen[c] = { ch: c, word: v.hanzi, wordPinyin: v.pinyin, en: v.en || "", ex: v.example || null };
          });
        });
      });
    });
  });
  want.forEach(function (c) { out.push(seen[c]); });
  return out;
}

/* ---- 화면 ---- */
/* 문장. 글자를 누르면 형광펜, 정답 확인 뒤에는 병음이 함께 보인다 */
function sentHTML(it, withPy) {
  var hz = hanziChars(it.zh);
  var toks = String(it.pinyin || "").split(/\s+/).filter(Boolean);
  var aligned = toks.length === hz.length;
  var hi = 0;
  return String(it.zh).split("").map(function (c) {
    if (!/[一-鿿]/.test(c))
      return '<span class="sc pn"><span class="sc-py">&nbsp;</span>'
        + '<span class="sc-h">' + esc(c) + "</span></span>";
    var py = aligned ? toks[hi] : "";
    hi++;
    return '<span class="sc' + (W.hard[c] ? " hard" : "") + '" data-a="mark" data-c="' + esc(c) + '">'
      + '<span class="sc-py">' + (withPy ? esc(py) : "&nbsp;") + "</span>"
      + '<span class="sc-h">' + esc(c) + "</span></span>";
  }).join("");
}

function textStage() {
  var t = S.text;
  var h = '<div class="textwrap"><p class="ttitle">'
    + sentHTML({ zh: t.title, pinyin: t.titlePinyin }, false) + "</p>"
    + t.lines.map(function (l) { return '<p class="tline">' + sentHTML(l, false) + "</p>"; }).join("")
    + "</div>";
  if (S.newOpen && t["new"] && t["new"].length)
    h += '<div class="newrow">' + t["new"].map(function (n) {
      return '<span class="nch"><b>' + esc(n.ch) + "</b>" + esc(n.py) + " · " + esc(n.ko) + "</span>";
    }).join("") + "</div>";
  return h;
}

function quizStage() {
  var q = S.qs[S.idx], done = S.picked > -1;
  var h = '<div class="qbody"><div class="sentwrap">'
    + '<span class="qkind">' + (q.kind === "who" ? "누가 한 말일까" : q.kind === "genre" ? "글 종류" : "뜻 고르기") + "</span>"
    + '<p class="sent' + (S.shown ? "" : " hide") + '">' + sentHTML(q.s, done) + "</p>"
    + (S.shown ? "" : '<button class="btn" data-a="again">다시 보기</button>')
    + "</div>";
  h += '<div class="opts">' + q.opts.map(function (o, i) {
    var cls = "opt";
    if (done && i === q.ans) cls += " right";
    else if (done && i === S.picked) cls += " wrong";
    else if (done) cls += " dim";
    return '<button class="' + cls + '" data-a="pick" data-i="' + i + '"' + (done ? " disabled" : "") + ">"
      + esc(o) + "</button>";
  }).join("") + "</div>";
  if (done)
    h += '<div class="reveal"><span class="rv-k">' + esc(koBody(q.s.ko)) + "</span>"
      + (q.kind === "who" ? '<span class="rv-w">' + esc(koTag(q.s.ko)) + "</span>" : "")
      + '<button class="btn icon" data-a="say" data-t="' + esc(q.s.zh) + '" aria-label="듣기">' + I.sound + "</button>"
      + '<button class="btn" data-a="slow" data-t="' + esc(q.s.zh) + '">느리게</button></div>';
  return h + "</div>";
}

function doneStage() {
  var ok = S.marks.filter(function (m) { return m.ok; }).length;
  var sec = S.marks.reduce(function (a, m) { return a + m.sec; }, 0);
  var avg = S.marks.length ? (sec / S.marks.length).toFixed(1) : "0";
  var miss = S.marks.filter(function (m) { return !m.ok; });
  var hard = Object.keys(W.hard);
  var h = '<div class="result"><div class="rs-row">'
    + '<div><p class="rs-big">' + ok + '<span class="muted">/' + S.marks.length + '</span></p><p class="cap">맞힘</p></div>'
    + '<div><p class="rs-big">' + avg + '<span class="muted">초</span></p><p class="cap">문장당</p></div>'
    + '<div><p class="rs-big">' + hard.length + '</p><p class="cap">표시한 글자</p></div></div>';
  if (miss.length)
    h += '<div class="relist">' + miss.map(function (m) {
      return '<button class="rerow" data-a="say" data-t="' + esc(m.zh) + '">'
        + '<span class="rr-h">' + esc(m.zh) + "</span>"
        + '<span class="rr-p">' + esc(m.pinyin) + "</span>"
        + '<span class="rr-k">' + esc(koBody(m.ko)) + "</span></button>"; }).join("") + "</div>";
  else h += '<div class="center"><p class="muted">모두 맞혔습니다</p></div>';
  if (hard.length) h += '<p class="hardrow">표시한 글자 · <b>' + esc(hard.join(" ")) + "</b></p>";
  return h + "</div>";
}

function readStage() {
  if (S.rd === "text" && S.text) return textStage();
  if (S.idx === -2 || !S.qs || !S.qs.length)
    return '<div class="center"><p class="muted">'
      + (S.weak ? "회화앱에서 약했던 문장이 아직 없습니다." : "이 화에는 읽을 문장이 없습니다.") + "</p></div>";
  if (S.idx < 0) return doneStage();
  return quizStage();
}

/* ===================== 획순 ===================== */
var STROKES = null, strokesLoading = false;
function ensureStrokes(after) {
  if (STROKES) return after && after();
  if (strokesLoading) return;
  strokesLoading = true;
  fetch("../data/strokes.json").then(function (r) { return r.json(); }).then(function (d) {
    STROKES = d; strokesLoading = false; render();
  }).catch(function () { strokesLoading = false; STROKES = {}; render(); });
}
function charData(c) { return (STROKES && STROKES[c]) ? { strokes: STROKES[c].s, medians: STROKES[c].m } : null; }
function hasStroke(c) { return !!(STROKES && STROKES[c]); }
function strokeDone(c) { return !!(W.stroke[c] && W.stroke[c].ok); }

var HW = { demo: null, quiz: null };
function killWriters() {
  ["demo", "quiz"].forEach(function (k) {
    if (HW[k]) { try { HW[k].cancelQuiz && HW[k].cancelQuiz(); } catch (e) {} HW[k] = null; }
  });
}

function buildStroke() {
  var host = el("cells"), it = S.list[S.idx];
  if (!host || !it) return;
  killWriters();
  host.innerHTML = "";
  if (!STROKES) { ensureStrokes(); return; }
  var data = charData(it.ch);
  if (!data) return;

  var box = host.getBoundingClientRect();
  if (box.width < 60 || box.height < 60) { setTimeout(function () { reflow(true); }, 220); return; }
  var size = Math.floor(Math.min(box.height, (box.width - 22) / 2));
  var ink = ink_model();
  ["demo", "quiz"].forEach(function (kind, i) {
    var cell = document.createElement("div");
    cell.className = "hwcell";
    cell.id = "hw-" + kind;
    cell.style.width = size + "px"; cell.style.height = size + "px";
    var tag = document.createElement("span");
    tag.className = "tagline";
    tag.textContent = i === 0 ? "획순 보기" : "따라 쓰기";
    cell.appendChild(tag);
    host.appendChild(cell);
  });

  var common = { width: size, height: size, padding: Math.round(size * 0.07),
    strokeColor: ink, radicalColor: isDark() ? "#ff6b60" : "#e5322a", drawingColor: ink,
    strokeAnimationSpeed: 1, delayBetweenStrokes: 220,
    charDataLoader: function (c, onLoad) { onLoad(charData(c)); } };

/* 획순 따라 쓰기 : HanziWriter 는 터치의 첫 손가락(touches[0])을 따라가고, 어느 손가락이든 떼면 획을 끝낸다.
   손바닥이 닿으면 망가지므로 터치 이벤트는 막고, 허용된 포인터(펜슬 등)만 마우스 이벤트로 바꿔 넘긴다 */
function guardQuiz(host, tries) {
  if (!host) return;
  var svgEl = host.querySelector("svg");
  if (!svgEl) { if ((tries || 0) < 20) setTimeout(function () { guardQuiz(host, (tries || 0) + 1); }, 40); return; }
  if (host.dataset.guard) return;
  host.dataset.guard = "1";
  ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (t) {
    host.addEventListener(t, function (e) { e.stopPropagation(); if (e.cancelable) e.preventDefault(); },
      { capture: true, passive: false });
  });
  var active = null;
  function send(type, e, target) {
    (target || svgEl).dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true,
      clientX: e.clientX, clientY: e.clientY, button: 0, buttons: type === "mouseup" ? 0 : 1 }));
  }
  host.addEventListener("pointerdown", function (ev) {
    if (ev.pointerType === "mouse") return;               /* 마우스는 원래 경로로 */
    ev.preventDefault();
    if (active !== null || !allowDraw(ev)) return;
    active = ev.pointerId;
    try { host.setPointerCapture(ev.pointerId); } catch (e) {}
    send("mousedown", ev);
  });
  host.addEventListener("pointermove", function (ev) {
    if (ev.pointerId !== active) return;
    var list = ev.getCoalescedEvents ? ev.getCoalescedEvents() : null;
    if (!list || !list.length) list = [ev];
    for (var i = 0; i < list.length; i++) send("mousemove", list[i]);
  });
  function up(ev) {
    if (ev.pointerId !== active) return;
    active = null;
    send("mouseup", ev, document);
  }
  host.addEventListener("pointerup", up);
  host.addEventListener("pointercancel", up);
  host.addEventListener("lostpointercapture", up);
}

function noteImage(pad, zh) {
  var W0 = Math.min(760, Math.round(pad.size));

  pad.strokes.forEach(function (st) { if (!st.pen) st.pen = "ball"; penAll(c, st, false, "#111"); });
  c.restore();
  c.strokeStyle = "#ccc"; c.beginPath();
  c.moveTo(0, H0 + .5); c.lineTo(W0, H0 + .5); c.stroke();
  c.fillStyle = "#888"; c.font = "13px sans-serif"; c.textAlign = "left";

async function aiGradeSentence(pad, zh) {
  var key = gmKey();
  if (!key) throw { msg: "Gemini 키가 없습니다. 왼쪽 아래 설정에서 넣어주세요." };
  var img = noteImage(pad, zh).split(",")[1];
  var prompt = "위쪽은 중국어를 배우는 한국인 학습자가 공책에 손으로 받아쓴 문장이고, "
    + "아래쪽 MODEL 은 정답 문장입니다. 정답은 「" + zh + "」입니다. 위쪽 손글씨를 평가하세요.\n\n"
    + "- shape: 자형. 각 글자의 획과 모양이 맞는가 (0~100)\n"
    + "- layout: 줄 맞춤과 글자 크기·간격의 일관성 (0~100)\n"
    + "- score: 전체 점수 (0~100). 인쇄체처럼 반듯할 필요는 없고, 읽기 좋고 자형이 맞으면 높게 줍니다.\n"
    + "- wrong: 틀리게 썼거나 빠진 글자만 이어서 쓰세요. 없으면 빈 문자열.\n"
    + "- good: 잘한 점 한 줄, 한국어 25자 이내\n"
    + "- tips: 고칠 점 2~3개, 각각 한국어 30자 이내. 어떤 글자의 어느 부분인지 구체적으로.\n\n"
    + "손글씨를 읽기 어려우면 추측하지 말고 tips 에 그렇게 쓰세요. JSON 객체 하나만 출력하세요.";
  var models = [W.gmModel || "gemini-3.6-flash", "gemini-flash-latest"];
  var res = null, lastErr = "";
  for (var i = 0; i < models.length; i++) {
    try {
      res = await fetch(GM_URL + "/" + models[i] + ":generateContent?key=" + encodeURIComponent(key), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [
            { inline_data: { mime_type: "image/png", data: img } }, { text: prompt }] }],
          generationConfig: { responseMimeType: "application/json", responseSchema: SENT_SCHEMA }
        })
      });
    } catch (e) { throw { msg: "인터넷 연결을 확인하세요." }; }
    if (res.ok) break;
    lastErr = res.status;
    if (res.status !== 404) break;
  }
  if (!res || !res.ok) {
    if (lastErr === 429) throw { msg: "Gemini 호출 한도를 넘었습니다." };
    if (lastErr === 400 || lastErr === 403) throw { msg: "Gemini 키를 확인하세요." };
    throw { msg: "Gemini 오류 " + lastErr };
  }
  var data = await res.json();
  var parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];
  var text = parts.map(function (p) { return p.text || ""; }).join("").replace(/```json|```/g, "").trim();
  try { return JSON.parse(text); }
  catch (e) { throw { msg: "응답을 읽지 못했습니다." }; }
}

function gradeSentence() {

  S.grade = { local: null, ai: null, sent: true, busy: true, err: "" };

    S.grade.busy = false; S.grade.err = (e && e.msg) || "채점하지 못했습니다."; render();
  });
}

function buildCells() {

/* ── 펜 팔레트 ──
   화면(#app)을 다시 그리지 않는 별도 층이다 — 열고 닫고 바꿔도 쓰던 칸은 그대로 남는다 */
var palOpen = false, palEl = null;
function unitNow() {
  if (pads.length) return pads[0].note ? pads[0].lineH : pads[0].size;
  return S.mode === "dict" ? 140 : 300;
}
/* 미리보기 획 : 가짜 필압을 실어 펜의 성격이 보이게 */
function sampleStroke(t, v, w, h, amp) {
  var st = { pen: t, seed: 777, pts: [] }, base = penBase(unitNow(), t, v), save = W.pressure;
  W.pressure = W.pressure || 1;
  var N = 26;
  for (var i = 0; i < N; i++) {
    var f = i / (N - 1), x = w * 0.1 + f * w * 0.8, y = h / 2 + Math.sin(f * 6.2832 * 0.9) * h * amp;
    var pr = 0.18 + 0.7 * Math.sin(f * 3.1416);
    var q = penPoint(st, { pointerType: "pen", pressure: pr, x: x, y: y }, st.pts[st.pts.length - 1], base, i);
    st.pts.push({ x: x, y: y, w: q.w, a: q.a, pr: q.pr });
  }
  if (t === "brush") { var n = st.pts.length; for (var j = 0; j < 6; j++) st.pts[n - 1 - j].w *= 0.28 + 0.72 * (j / 6); }
  W.pressure = save;
  return st;
}
function prepCanvas(cv) {
  var r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  var c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, r.width, r.height);
  return { c: c, w: r.width, h: r.height };
}
function paintSample(cv, t, v, amp) {
  if (!cv) return;
  var k = prepCanvas(cv);
  penAll(k.c, sampleStroke(t, v, k.w, k.h, amp), false, ink("pen"));
}
function paintPenBtn() {
  var cv = el("penico"), nm = el("penname");
  if (nm) nm.textContent = PENS[penType()].name;
  if (cv) paintSample(cv, penType(), penV(penType()), 0.22);
  var b = el("penbtn"); if (b) b.classList.toggle("on", palOpen);
}
function palHTML() {
  return '<div class="pp-types">' + PEN_ORDER.map(function (t) {
      return '<button class="pp-type' + (t === penType() ? " on" : "") + '" data-a="pentype" data-v="' + t + '">'
        + '<canvas data-pen="' + t + '"></canvas>' + PENS[t].name + "</button>"; }).join("") + "</div>"
    + '<div class="pp-row"><span class="cap">굵기</span><b id="ppw"></b></div>'
    + '<div class="pp-slider" id="ppslider"><canvas id="ppwedge"></canvas><span class="pp-thumb" id="ppthumb"></span></div>'
    + '<div class="pp-ends"><span>가늘게</span><span>굵게</span></div>'
    + '<canvas class="pp-preview" id="pppreview"></canvas>';
}
function paintPal() {
  if (!palEl) return;
  var t = penType(), v = penV(t);
  palEl.querySelectorAll(".pp-type").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-v") === t); });
  palEl.querySelectorAll(".pp-type canvas").forEach(function (cv) {
    var tt = cv.getAttribute("data-pen"); paintSample(cv, tt, penV(tt), 0.2);
  });
  var wedge = el("ppwedge");
  if (wedge) {
    var k = prepCanvas(wedge), pad = 20, y = k.h / 2;
    var lo = Math.max(1, penBase(unitNow(), t, 0)), hi = penBase(unitNow(), t, 1);
    hi = Math.min(hi, k.h * 0.7);
    k.c.fillStyle = cssv("--hair");
    k.c.beginPath(); k.c.moveTo(pad, y - lo / 2); k.c.lineTo(k.w - pad, y - hi / 2);
    k.c.arc(k.w - pad, y, hi / 2, -1.5708, 1.5708); k.c.lineTo(pad, y + lo / 2); k.c.closePath(); k.c.fill();
    var x = pad + v * (k.w - 2 * pad);
    k.c.fillStyle = cssv("--accent");
    var cur = lo + (hi - lo) * v;
    k.c.beginPath(); k.c.moveTo(pad, y - lo / 2); k.c.lineTo(x, y - cur / 2); k.c.lineTo(x, y + cur / 2);
    k.c.lineTo(pad, y + lo / 2); k.c.closePath(); k.c.fill();
    var th = el("ppthumb"); if (th) th.style.left = x + "px";
  }
  var lbl = el("ppw"); if (lbl) lbl.textContent = penBase(unitNow(), t).toFixed(1) + " px";
  paintSample(el("pppreview"), t, v, 0.26);
  paintPenBtn();
}
function openPal() {
  if (!palEl) {
    palEl = document.createElement("div");
    palEl.className = "penpal"; palEl.id = "penpal";
    document.body.appendChild(palEl);
  }

/* 팔레트 밖을 누르면 닫는다 — 쓰는 칸을 눌렀다면 닫으면서 그대로 쓴다 */
document.addEventListener("pointerdown", function (ev) {
  if (!palOpen) return;
  if (ev.target.closest && ev.target.closest("#penpal,#penbtn")) return;
  closePal();
}, true);
/* 굵기 슬라이더 : 펜슬·손가락 모두 끌어서 조절 */
var slideId = null;
function slideTo(ev) {
  var s = el("ppslider"); if (!s) return;
  var r = s.getBoundingClientRect(), pad = 20;
  var v = Math.max(0, Math.min(1, (ev.clientX - r.left - pad) / (r.width - 2 * pad)));
  if (!W.penW) W.penW = {};
  W.penW[penType()] = Math.round(v * 100) / 100;
  paintPal();
}
document.addEventListener("pointerdown", function (ev) {
  var s = ev.target.closest && ev.target.closest("#ppslider");
  if (!s) return;
  ev.preventDefault();
  slideId = ev.pointerId;
  try { s.setPointerCapture(ev.pointerId); } catch (e) {}
  slideTo(ev);
}, { passive: false });
document.addEventListener("pointermove", function (ev) {
  if (ev.pointerId === slideId) { ev.preventDefault(); slideTo(ev); }
}, { passive: false });
function slideEnd(ev) { if (ev.pointerId === slideId) { slideId = null; save(); } }
document.addEventListener("pointerup", slideEnd);
document.addEventListener("pointercancel", slideEnd);

/* ── 지우개 ──
   손가락 : 누르고 있는 동안만 지우개. 짧게 톡 치면 고정 ↔ 해제
   펜슬   : 톡 치면 고정 ↔ 해제 (펜슬 하나로는 누른 채 지울 수 없으니까)
   화면을 다시 그리지 않고 상태만 바꾼다 — 쓰던 칸이 흔들리지 않는다 */
var holdPid = null, holdKey = false, holdT0 = 0, holdUsed = false;
S.eraseLock = false;
function eraseOn() { return !!(S.eraseLock || holdPid !== null || holdKey); }
function eraseLabel() { return S.eraseLock ? "고정됨<br>톡 치면 해제" : "누르는 동안<br>톡 치면 고정"; }
function setErase() {
  var on = eraseOn();
  S.erase = on;
  document.body.classList.toggle("erasing", on);
  var b = el("erasebtn");
  if (b) {
    b.classList.toggle("on", on);
    b.classList.toggle("lock", !!S.eraseLock);
    var sm = b.querySelector("small");
    if (sm) sm.innerHTML = eraseLabel();
  }
}
document.addEventListener("pointerdown", function (ev) {
  var b = ev.target.closest && ev.target.closest("#erasebtn");
  if (!b) return;
  ev.preventDefault();
  if (ev.pointerType === "pen" || ev.pointerType === "mouse") { S.eraseLock = !S.eraseLock; return setErase(); }
  if (bigContact(ev) || holdPid !== null) return;          /* 손바닥 · 이미 누르는 중 */
  holdPid = ev.pointerId; holdT0 = Date.now(); holdUsed = false;
  try { b.setPointerCapture(ev.pointerId); } catch (e) {}
  setErase();
}, { passive: false });
function releaseHold(ev) {
  if (holdPid === null || ev.pointerId !== holdPid) return;
  holdPid = null;
  if (Date.now() - holdT0 < 280 && !holdUsed) S.eraseLock = !S.eraseLock;   /* 짧게 톡 → 고정 */
  setErase();
}
document.addEventListener("pointerup", releaseHold);
document.addEventListener("pointercancel", releaseHold);
document.addEventListener("lostpointercapture", releaseHold);
document.addEventListener("contextmenu", function (ev) {
  if (ev.target.closest && ev.target.closest("#erasebtn,.cell,.note")) ev.preventDefault();
});

function render() {
  lastVW = window.innerWidth; lastVH = window.innerHeight;

  if (key !== S.lastKey) { S.lastKey = key; S.eraseLock = false; }
  S.erase = eraseOn();
  document.body.classList.toggle("erasing", !!S.erase);
  document.getElementById("app").innerHTML = mainHTML();
  if (S.mode === "trace") buildCells();
  else if (S.mode === "stroke") buildStroke();

function loadList() {
  if (S.mode === "read") return loadRead();
  if (S.mode === "dict") return loadDict();
  var all = S.hard ? hardList() : S.weak ? weakList() : epChars(week());
  if (S.mode === "stroke") {
    ensureStrokes();
    var withData = all.filter(function (c) { return !STROKES || hasStroke(c.ch); });
    var left = withData.filter(function (c) { return !strokeDone(c.ch); });
    S.list = (W.onlyNew && left.length) ? left : withData;
    S.idx = 0; S.qmiss = 0;
    return;
  }
  var fresh = all.filter(function (c) { return !charDone(c.ch); });
  S.list = (W.onlyNew && fresh.length) ? fresh : all;
  S.idx = 0; S.rep = 0;
}

function nextChar() {
  var it = S.list[S.idx];
  S.grade = null;
  var rec = W.chars[it.ch] || (W.chars[it.ch] = { n: 0, last: 0 });
  var drawn = pads.filter(function (p) { return !p.empty(); }).length;
  rec.n += drawn; rec.last = Date.now();
  save();
  if (S.idx + 1 < S.list.length) { S.idx++; S.rep = 0; render(); }
  else { S.idx = 0; S.rep = 0; render(); }
}

/* ===================== 이벤트 ===================== */
function act(t) {
  if (!t || t.disabled) return;
  var a = t.getAttribute("data-a");
  if (a === "ph") { W.ph = +t.getAttribute("data-i"); W.wk = 0; S.weak = false; S.hard = false;
    save(); loadList(); return render(); }
  if (a === "wk") { W.wk = +t.getAttribute("data-i"); S.weak = false; S.hard = false;
    save(); loadList(); return render(); }
  if (a === "weak") { S.weak = true; S.hard = false; loadList(); return render(); }
  if (a === "hard") { S.hard = true; S.weak = false; S.mode = "trace"; loadList(); return render(); }
  if (a === "tohard") { S.mode = "trace"; S.hard = true; S.weak = false; loadList(); return render(); }
  if (a === "pick") return answer(+t.getAttribute("data-i"));
  if (a === "nextq") return nextQ();
  if (a === "again") { S.shown = true; render(); return startFlash(); }
  if (a === "flash") { W.flash = !W.flash; save(); S.shown = true; clearTimeout(flashT); return render(); }
  if (a === "mark") return markChar(t.getAttribute("data-c"));
  if (a === "mode") { S.mode = t.getAttribute("data-m"); S.weak = false; S.hard = false;
    loadList(); return render(); }
  if (a === "say") return speak(t.getAttribute("data-t"));
  if (a === "slow") return speak(t.getAttribute("data-t"), 0.6);
  if (a === "hwplay") { if (HW.demo) HW.demo.animateCharacter(); return; }
  if (a === "hwhint") { if (HW.demo) HW.demo.animateCharacter(); return; }
  if (a === "hwclear") { return buildStroke(); }
  if (a === "dreveal") { S.reveal = true; return render(); }
  if (a === "doverlay") { S.overlay = !S.overlay; return render(); }
  if (a === "dko") { S.showKo = !S.showKo; return render(); }
  if (a === "penpal") { if (palOpen) closePal(); else openPal(); return; }
  if (a === "pentype") { W.pen = t.getAttribute("data-v"); save(); paintPal(); return; }
  if (a === "gear") { S.setOpen = !S.setOpen; S.listOpen = false; return render(); }
  if (a === "list") { S.listOpen = !S.listOpen; S.setOpen = false; return render(); }
  if (a === "closeov") { S.setOpen = false; S.listOpen = false; return render(); }
  if (a === "settheme") { W.theme = t.getAttribute("data-v"); save(); applyTheme(); return render(); }
  if (a === "setinput") { W.input = t.getAttribute("data-v"); save(); return render(); }
  if (a === "setpress") { W.pressure = +t.getAttribute("data-v"); save(); return render(); }
  if (a === "setnew") { W.onlyNew = t.getAttribute("data-v") === "1"; save(); loadList(); return render(); }
  if (a === "dgrade") return gradeSentence();
  if (a === "dmark") { return dictMark(+t.getAttribute("data-s")); }
  if (a === "dclear") { S.grade = null; S.dstrokes = []; return render(); }
  if (a === "toquiz") { S.rd = "quiz"; S.idx = S.qs.length ? 0 : -2; S.picked = -1; S.marks = [];
    S.t0 = Date.now(); S.shown = !flashNow(); if (!S.shown) startFlash(); return render(); }
  if (a === "totext") { S.rd = "text"; return render(); }
  if (a === "newchars") { S.newOpen = !S.newOpen; return render(); }
  if (a === "readagain") { loadRead(); return render(); }
  if (a === "theme") {
    W.theme = W.theme === "auto" ? "light" : W.theme === "light" ? "dark" : "auto";
    save(); applyTheme(); return render();
  }
  if (a === "onlynew") { W.onlyNew = !W.onlyNew; save(); loadList(); return render(); }
  if (a === "undo") {
    var done = false;
    while (strokeLog.length && !done) {
      var lp = strokeLog.pop();
      if (pads.indexOf(lp) > -1 && !lp.empty()) { lp.undo(); done = true; }
    }
    if (!done) for (var i = pads.length - 1; i >= 0; i--) if (!pads[i].empty()) { pads[i].undo(); break; }
    return onDraw();
  }
  if (a === "clear") { S.grade = null; pads.forEach(function (p) { p.clear(); }); render(); return onDraw(); }
  if (a === "keypanel") { S.keyOpen = !S.keyOpen; return render(); }
  if (a === "savekey") {
    var box = document.getElementById("gmkey");
    W.gmKey = box ? box.value.trim() : ""; save(); toast(W.gmKey ? "키를 저장했습니다" : "회화앱 키를 씁니다"); return render();
  }
  if (a === "jump") {
    var j = +t.getAttribute("data-i");
    S.listOpen = false;
    if (j === S.idx) return render();
    S.idx = j; S.rep = 0; S.qmiss = 0; S.reveal = false; S.overlay = false;
    S.grade = null; S.dstrokes = [];
    return render();
  }
  if (a === "prev") { if (S.idx) { S.idx--; S.rep = 0; S.qmiss = 0; S.reveal = false; S.overlay = false;
    S.grade = null; S.dstrokes = []; render(); } return; }
  if (a === "next") {
    if (S.mode === "stroke") {
      if (S.idx + 1 < S.list.length) { S.idx++; S.qmiss = 0; } else { S.idx = 0; S.qmiss = 0; }
      return render();
    }
    return nextChar();
  }
}

/* ── 누르기 판정 : 펜슬·손가락·마우스 모두 포인터 이벤트로 직접 판정한다 ──
   · 펜슬 탭은 언제나 받는다 — 쓰다가 펜슬로 '다음', '되돌리기'를 눌러도 된다
   · 손가락 탭은 펜슬이 닿아 있거나 막 뗀 순간 · 손바닥처럼 넓은 접촉 · 0.7초 넘는 누름이면 버린다
   · 뒤따라오는 사파리의 click 은 무시한다 (화면이 바뀐 뒤 엉뚱한 버튼이 눌리는 것 방지) */
function sig(t) {
  return ["data-a", "data-i", "data-m", "data-v", "data-s", "data-c", "data-t"].map(function (k) {
    return t.getAttribute(k) || ""; }).join("|");
}
var taps = {}, suppressClick = 0;
document.addEventListener("pointerdown", function (ev) {
  if (ev.pointerType === "pen")                          /* 펜슬이 닿으면 진행 중인 손가락 탭은 무효 */
    for (var k in taps) if (taps[k].type === "touch") taps[k].pen = true;
}, true);
document.addEventListener("pointerdown", function (ev) {
  var t = ev.target.closest && ev.target.closest("[data-a]");
  if (!t) return;
  if (ev.pointerType === "touch" && (penActive() || bigContact(ev))) return;
  taps[ev.pointerId] = { sig: sig(t), x: ev.clientX, y: ev.clientY, t: Date.now(), type: ev.pointerType, pen: false };
});
document.addEventListener("pointermove", function (ev) {
  var tp = taps[ev.pointerId];
  if (tp && Math.hypot(ev.clientX - tp.x, ev.clientY - tp.y) > (tp.type === "pen" ? 18 : 12)) delete taps[ev.pointerId];
});
document.addEventListener("pointerup", function (ev) {
  var tp = taps[ev.pointerId];
  delete taps[ev.pointerId];
  if (!tp) return;
  if (tp.type === "touch" && (tp.pen || Date.now() - tp.t > 700)) return;
  var over = document.elementFromPoint(ev.clientX, ev.clientY);
  var t = over && over.closest("[data-a]");
  if (!t || sig(t) !== tp.sig || t.disabled) return;
  suppressClick = Date.now() + 700;
  act(t);
});
document.addEventListener("pointercancel", function (ev) { delete taps[ev.pointerId]; });
document.addEventListener("click", function (ev) {
  var t = ev.target.closest && ev.target.closest("[data-a]");
  if (!t) return;
  ev.preventDefault();
  if (Date.now() < suppressClick) return;
  if (ev.detail === 0) act(t);                           /* 키보드 Enter · Space */
});
/* 받아쓰기 본보기에 쓰는 손글씨체(楷体)를 미리 불러온다 — 캔버스는 로드된 폰트만 쓴다 */
if (window.FontFace) {
  try {
    var handFace = new FontFace("HandZh", 'url(../fonts/HandZh.woff2)');
    handFace.load().then(function (f) { document.fonts.add(f); if (S.ready) render(); }).catch(function () {});
  } catch (e) {}
}
/* 세로↔가로 전환 때 칸 크기를 다시 잡는다 — 쓴 획은 유지한다 */
var reflowT = null, lastVW = 0, lastVH = 0;
function reflow(force) {
  if (!S.ready) return;
  var vw = window.innerWidth, vh = window.innerHeight;
  if (force !== true && vw === lastVW && vh === lastVH && el("cells") && el("cells").children.length) return;
  lastVW = vw; lastVH = vh;
  clearTimeout(reflowT);
  reflowT = setTimeout(function () {
    if (pads.some(function (p) { return p.cur; })) return;   /* 쓰는 중이면 미룬다 */
    if (S.mode === "trace") {
      var keep = pads.map(function (p) { return p.strokes; });
      var order = strokeLog.map(function (p) { return pads.indexOf(p); });
      buildCells();
      pads.forEach(function (p, i) { if (keep[i] && keep[i].length) { p.strokes = keep[i]; p.redraw(); } });
      strokeLog = order.filter(function (i) { return i > -1 && pads[i]; }).map(function (i) { return pads[i]; });
      onDraw();
    } else if (S.mode === "stroke") buildStroke();
    else if (S.mode === "dict") buildDictCells();
  }, 160);
}
window.addEventListener("resize", function () { reflow(); });
window.addEventListener("orientationchange", function () { reflow(true); setTimeout(function () { reflow(true); }, 500); });
if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme:dark)");
  var onScheme = function () { applyTheme(); if (S.ready) render(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
document.addEventListener("gesturechange", function (e) { e.preventDefault(); });
/* 목록(글자 트랙·문장 목록·화 선택·지문) 밖에서는 끌기·핀치를 막는다 */
var SCROLLERS = ".chips,.slist,.epbar,.textwrap,.relist,.keybox";
document.addEventListener("touchmove", function (ev) {
  if (!ev.cancelable) return;
  if (ev.touches.length > 1) return ev.preventDefault();
  if (ev.target.closest && ev.target.closest(SCROLLERS)) return;
  ev.preventDefault();
}, { passive: false });

/* 키보드를 붙였을 때 : E 를 누르고 있는 동안 지우개 */
document.addEventListener("keydown", function (ev) {
  if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;
  if (ev.key.toLowerCase() === "e" && writes() && !ev.repeat) { holdKey = true; setErase(); }
});
document.addEventListener("keyup", function (ev) {
  if (ev.key.toLowerCase() === "e" && holdKey) { holdKey = false; setErase(); }
});

/* ===================== 시작 ===================== */
Promise.all(["../data/hsk1-3_curriculum.json", "../data/hsk4_curriculum.json",
  "../data/reading_texts.json"].map(function (f) {
  return fetch(f).then(function (r) {
    if (!r.ok) throw new Error(f + " 를 찾을 수 없습니다");
    return r.json();
  });
})).then(function (all) {
  CUR = { phases: all.slice(0, 2) };
  RT = all[2] || {};
  if (W.ph >= CUR.phases.length) W.ph = 0;
  if (W.wk >= phase().weeks.length) W.wk = 0;
  S.ready = true;
  loadList();
  render();
}).catch(function (e) {
  document.querySelector(".main").innerHTML =
    '<div class="stage"><div class="center"><p>데이터를 불러오지 못했습니다</p>'
    + '<p class="muted">' + esc(e.message) + "</p>"
    + '<p class="muted">회화앱의 data 폴더 옆, write/ 안에 두고 주소로 여세요.</p></div></div>';
});
</script>
