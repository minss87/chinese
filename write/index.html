<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한자 쓰기">
<title>한자 쓰기 · 金老师의 베이징 일기</title>
<style>
@font-face{font-family:"Pretendard";font-style:normal;font-weight:100 500;font-display:swap;
  src:url("../fonts/Pretendard-Regular.woff2") format("woff2");}
@font-face{font-family:"Pretendard";font-style:normal;font-weight:600 900;font-display:swap;
  src:url("../fonts/Pretendard-Bold.woff2") format("woff2");}
/* 한자 손글씨체 — 이 파일만 바꾸면 글씨체가 전부 바뀐다 */
@font-face{font-family:"HandZh";src:url("../fonts/HandZh.woff2") format("woff2");font-display:swap;}

:root{
  --bg:#fafafb; --sheet:#ffffff; --ink:#14161a; --ink2:#6b7079; --ink3:#a6abb3;
  --hair:#e9eaee; --hair2:#f1f2f5; --accent:#2f6df0; --accent2:#e5322a;
  --pick:#eef2fb; --gridline:#dcdfe4; --mark:rgba(255,214,10,.45);
  --ok:#2e9e5b; --okbg:#e9f6ee; --bad:rgba(229,50,42,.1); --badline:rgba(229,50,42,.4);
  --model:#14161a; --pen:#14161a;
}
:root[data-theme="dark"]{
  --bg:#1a1c1f; --sheet:#24272b; --ink:#f1f2f4; --ink2:#9ba1a9; --ink3:#6d737b;
  --hair:#2b2f34; --hair2:#23262a; --accent:#7aa2ff; --accent2:#ff6b60;
  --pick:#1f2734; --gridline:#3a3f46; --mark:rgba(255,214,10,.3);
  --ok:#5fc08c; --okbg:rgba(46,158,91,.18); --bad:rgba(255,107,96,.14); --badline:rgba(255,107,96,.42);
  --model:#f1f2f4; --pen:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{margin:0;background:var(--bg);color:var(--ink);letter-spacing:-.011em;
  font:15px/1.5 "Pretendard",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;}
.zh{font-family:"HandZh","PingFang SC","Noto Sans CJK SC",serif;}
#app{height:100%;display:flex;flex-direction:column;}
.cap{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--ink3);}
.muted,.hintline{font-size:13px;color:var(--ink3);}
.hintline{flex:1;}
.spacer{flex:1;}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;}

/* ── 1행 : 탭 ── */
.tabs{flex:none;display:flex;align-items:flex-end;gap:24px;padding:18px 30px 0;border-bottom:1px solid var(--hair);}
.mode{background:none;border:0;padding:0 0 12px;font:inherit;font-size:15px;color:var(--ink3);
  cursor:pointer;position:relative;}
.mode.on{color:var(--ink);font-weight:700;}
.mode.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);}
.seg{display:flex;align-items:center;gap:14px;padding-bottom:11px;}
.seg-b{background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink3);cursor:pointer;padding:0;}
.seg-b.on{color:var(--ink);font-weight:700;}

/* ── 2행 : 화 선택 ── */
.epbar{flex:none;display:flex;align-items:center;gap:5px;padding:9px 30px;
  border-bottom:1px solid var(--hair);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
.epbar::-webkit-scrollbar{display:none;}
.epbtn{background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink3);
  padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:none;}
.epbtn.done{color:var(--ink2);}
.epbtn.done:after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--accent);margin-left:5px;vertical-align:middle;}
.epbtn.on{background:var(--ink);color:var(--bg);font-weight:600;}
.epbtn.on:after{background:var(--bg);opacity:.6;}
.epbtn.flag{color:var(--accent2);}
.epbtn.flag.on{background:var(--accent2);color:#fff;}
.prog{display:inline-flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);
  white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;padding-left:8px;}
.prog .mini{width:84px;height:3px;background:var(--hair2);border-radius:3px;overflow:hidden;}
.prog .mini i{display:block;height:100%;background:var(--accent);border-radius:3px;}

/* ── 본문 ── */
.body{flex:1;min-height:0;display:flex;padding:22px 30px 18px;gap:32px;}

/* 좌 : 설명 칸 */
.side{width:226px;flex:none;display:flex;flex-direction:column;min-height:0;}
.glyphbig{font-size:100px;line-height:1;letter-spacing:-.02em;color:var(--ink);}
.side .py{font-size:21px;color:var(--accent2);font-weight:700;margin-top:10px;}
.side .ko{font-size:16px;font-weight:600;margin-top:13px;}
.side .en{font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:4px;}
.side .lead{font-size:23px;font-weight:700;line-height:1.4;letter-spacing:-.02em;}
.side .lead.zh{font-size:24px;}
.facts{margin-top:18px;display:flex;flex-direction:column;border-top:1px solid var(--hair);}
.fact{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair2);}
.fact span{font-size:11.5px;color:var(--ink3);}
.fact b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
.track{margin-top:20px;flex:1;min-height:0;display:flex;flex-direction:column;}
.track .cap{padding:0 0 9px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;overflow:auto;padding-bottom:4px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);}
.chip{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:16px;
  background:var(--sheet);border:1px solid var(--hair);color:var(--ink3);cursor:pointer;padding:0;font-family:inherit;}
.chip.done{background:var(--pick);border-color:transparent;color:var(--accent);}
.chip.now{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.chip.flag{border-color:var(--accent2);color:var(--accent2);}
.slist{display:flex;flex-direction:column;gap:2px;overflow:auto;}
.srow{display:flex;align-items:center;gap:9px;background:none;border:0;font:inherit;text-align:left;
  cursor:pointer;padding:8px 9px;border-radius:8px;color:var(--ink2);}
.srow .n{font-size:10.5px;font-weight:700;color:var(--ink3);min-width:16px;}
.srow .t{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srow.done .n{color:var(--accent);}
.srow.on{background:var(--ink);color:var(--bg);} .srow.on .n{color:var(--bg);opacity:.65;}
.qdots{display:flex;flex-wrap:wrap;gap:5px;}
.qdot{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;
  background:var(--sheet);border:1px solid var(--hair);color:var(--ink3);}
.qdot.done{background:var(--pick);border-color:transparent;color:var(--accent);}
.qdot.miss{background:var(--bad);border-color:transparent;color:var(--accent2);}
.qdot.now{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.tools{margin-top:auto;display:flex;gap:6px;padding-top:16px;align-items:center;}
.tool,.ico{width:40px;height:40px;border:1px solid var(--hair);border-radius:11px;background:var(--sheet);
  color:var(--ink3);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;}
.tool svg,.ico svg{width:19px;height:19px;}
.tool.on,.ico.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.tool:active,.ico:active{transform:scale(.95);}
.keybtn{border:0;background:none;color:var(--ink3);font:inherit;font-size:11.5px;padding:8px 2px;
  cursor:pointer;text-align:left;}
.keybox{display:flex;flex-direction:column;gap:6px;padding-top:6px;}
.keybox .input{width:100%;border:1px solid var(--hair);background:var(--sheet);border-radius:9px;
  padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);}
.foot{margin:0;font-size:11px;color:var(--ink3);}

/* 우 : 작업 영역 */
.main{flex:1;min-width:0;display:flex;}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;}
.footrow{display:flex;align-items:center;gap:4px;padding-top:16px;}
.pill{background:none;border:0;font:inherit;font-size:13.5px;color:var(--ink2);
  padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;}
.pill:active{transform:scale(.98);}
.pill.solid{background:var(--ink);color:var(--bg);font-weight:600;padding:11px 24px;border-radius:999px;}
.pill.on{color:var(--accent);font-weight:600;background:var(--pick);}
.pill[disabled]{color:var(--ink3);cursor:default;}
.pill.solid[disabled]{background:var(--hair2);color:var(--ink3);}

/* 쓰는 칸 */
.cellwrap-row{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;}
.cells{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  height:min(100cqh,100cqw);width:min(100cqh,100cqw);
  background:var(--sheet);border:1px solid var(--hair);border-radius:8px;overflow:hidden;}
.cellwrap{position:relative;display:grid;place-items:center;min-width:0;min-height:0;}
.cellwrap:nth-child(-n+2){border-bottom:1px solid var(--hair);}
.cellwrap:nth-child(odd){border-right:1px solid var(--hair);}
.cell{display:block;touch-action:none;background:transparent;}
.tagline{position:absolute;top:9px;left:12px;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);font-weight:700;}
.erasing .cell,.erasing .note{cursor:cell;}

/* 획순 */
.hwrow{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:22px;container-type:size;}
.hwcell{height:min(100cqh,46cqw);width:min(100cqh,46cqw);position:relative;overflow:hidden;
  background:var(--sheet);border:1px solid var(--hair);border-radius:8px;
  background-image:
    repeating-linear-gradient(to bottom, var(--gridline) 0 5px, transparent 5px 11px),
    repeating-linear-gradient(to right, var(--gridline) 0 5px, transparent 5px 11px);
  background-size:1px 86%,86% 1px;
  background-position:center center,center center;
  background-repeat:no-repeat,no-repeat;}
.hwcell svg{display:block;}
.gline{display:flex;align-items:center;gap:14px;padding-top:14px;}
.gauge{display:flex;gap:5px;}
.gauge i{width:26px;height:3px;border-radius:3px;background:var(--hair2);display:block;flex:none;}
.gauge i.d{background:var(--ink);} .gauge i.c{background:var(--accent);}

/* 받아쓰기 공책 */
.audio{display:flex;align-items:center;gap:11px;padding-bottom:13px;}
.wave{flex:1;height:24px;display:flex;align-items:center;gap:2px;overflow:hidden;}
.wave i{flex:1;background:var(--hair);border-radius:2px;}
.notewrap{flex:1;min-height:0;display:flex;}
.note{flex:1;display:block;border-radius:8px;touch-action:none;background:var(--sheet);border:1px solid var(--hair);}
.answer{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 0 0;}
.ans-zh{font-size:27px;font-family:"HandZh","PingFang SC",serif;}
.ans-py{font-size:14px;color:var(--accent2);}

/* 읽기 */
.textwrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:6px 0;}
.ttitle{margin:0 0 14px;text-align:center;}
.ttitle .sc-h{font-size:34px;font-weight:700;}
.tline{margin:0;text-align:center;}
.tline .sc-h{font-size:27px;}
.tline .sc-py,.ttitle .sc-py{min-height:0;font-size:0;}
.sent{margin:0;text-align:center;line-height:1.35;display:flex;flex-wrap:wrap;
  justify-content:center;align-items:flex-end;gap:2px;}
.sent.hide .sc-h{color:transparent;text-shadow:0 0 22px rgba(20,24,33,.45);}
.sc{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;padding:0 2px;border-radius:6px;}
.sc.pn{cursor:default;padding:0;margin-left:-.12em;}
.sc.hard{background:var(--mark);}
.sc-py{font-size:15px;line-height:1.4;color:var(--accent2);font-weight:600;min-height:21px;}
.sc-h{font-size:46px;font-weight:400;line-height:1.15;font-family:"HandZh","PingFang SC",serif;}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
.sentwrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
.qkind{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent2);}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:600px;}
.opt{border:1px solid var(--hair);background:var(--sheet);color:var(--ink);font:inherit;
  font-size:14.5px;text-align:left;padding:13px 16px;border-radius:10px;cursor:pointer;line-height:1.4;}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600;}
.opt.wrong{border-color:var(--badline);background:var(--bad);}
.opt.dim{opacity:.4;}
.reveal{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;max-width:600px;}
.rv-k{font-size:16px;font-weight:600;}
.rv-w{font-size:13px;color:var(--ink3);flex:1;}
.nch{font-size:14px;color:var(--ink2);}
.nch b{font-size:20px;margin-right:6px;font-family:"HandZh","PingFang SC",serif;color:var(--ink);}
.newrow{display:flex;gap:18px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--hair);margin-top:10px;}
.gradebox{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:12px;}
.gsc{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink2);}
.gsc b{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
.gsc.ai b{color:var(--accent);}
.gsub{font-size:13px;color:var(--ink3);}
.gsub.err{color:var(--accent2);}
.gtip{margin:0;font-size:14px;color:var(--ink2);}
.gtip.good{color:var(--ink);font-weight:600;}
.rs-row{display:flex;gap:40px;padding:6px 0 18px;}
.rs-big{font-size:38px;font-weight:700;margin:0;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.relist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;}
.rerow{display:flex;align-items:baseline;gap:14px;text-align:left;width:100%;cursor:pointer;
  border:0;border-top:1px solid var(--hair2);background:none;padding:13px 4px;font:inherit;color:var(--ink);}
.rr-h{font-size:22px;font-family:"HandZh","PingFang SC",serif;}
.rr-p{font-size:13px;color:var(--accent2);}
.rr-k{font-size:13px;color:var(--ink3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hardrow{margin:10px 0 0;font-size:14px;color:var(--ink2);}
.hardrow b{font-size:21px;font-family:"HandZh","PingFang SC",serif;
  background:var(--mark);border-radius:5px;padding:2px 6px;color:var(--ink);}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;
  border:2px solid var(--hair);border-top-color:var(--ink2);animation:sp .7s linear infinite;margin-right:7px;}
@keyframes sp{to{transform:rotate(360deg);}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);font-size:14px;padding:11px 18px;border-radius:999px;z-index:9;}
.rotate{display:none;}
@media (orientation:portrait) and (max-width:900px){
  .rotate{display:flex;position:fixed;inset:0;z-index:9;background:var(--bg);
    align-items:center;justify-content:center;text-align:center;padding:40px;font-size:17px;color:var(--ink2);}
}
[data-theme="dark"] .sent.hide .sc-h{text-shadow:0 0 22px rgba(255,255,255,.45);}
</style>
</head>
<body>
<div id="app"><div class="body"><div class="side"><p class="sub">불러오는 중</p></div></div></div>
<div class="rotate">가로로 돌려주세요</div>

<script src="./hanzi-writer.min.js"></script>
<script>
"use strict";

/* ===================== 저장 ===================== */
var WK = "cw:v1";                      /* 쓰기 앱 전용 — 회화앱 진도와 분리 */
var TALK_KEY = "ct:v4";                /* 회화앱 저장소 (같은 도메인이면 읽힌다) */
var BUILD = "2026-09-27 w2";

var saved = (function () {
  try { return JSON.parse(localStorage.getItem(WK)) || {}; } catch (e) { return {}; }
})();
var W = {
  chars: saved.chars || {},            /* {한자: {n: 따라쓴 횟수, last: 시각}} */
  ph: typeof saved.ph === "number" ? saved.ph : 0,
  wk: typeof saved.wk === "number" ? saved.wk : 0,
  brush: saved.brush !== false,        /* 붓 느낌 */
  onlyNew: saved.onlyNew !== false,    /* 아직 안 쓴 글자·안 읽은 문장만 */
  read: saved.read || {},              /* {r:문장: {s:0 틀림/2 맞힘, n, last}} */
  hard: saved.hard || {},              /* 형광펜으로 표시한 글자 */
  stroke: saved.stroke || {},          /* 획순 통과한 글자 */
  dict: saved.dict || {},              /* 받아쓰기 결과 */
  flash: saved.flash !== false,        /* 문제마다 무작위로 2.5초 플래시 */
  theme: saved.theme || "auto",        /* auto | light | dark */
  gmKey: saved.gmKey || "",            /* 비어 있으면 회화앱 키를 빌려 쓴다 */
  gmModel: saved.gmModel || "gemini-3.6-flash"
};
function save() { try { localStorage.setItem(WK, JSON.stringify(W)); } catch (e) {} }
applyThemeSoon();
function applyThemeSoon() { try { applyTheme(); } catch (e) {} }

/* 회화앱에서 약했던 문장 → 약한 글자 */
function talkData() {
  try { return JSON.parse(localStorage.getItem(TALK_KEY)) || null; } catch (e) { return null; }
}
function weakChars() {
  var t = talkData(); if (!t) return [];
  var seen = {}, out = [];
  Object.keys(t.missed || {}).forEach(function (k) {
    hanziChars((t.missed[k] || {}).zh).forEach(function (c) {
      if (!seen[c]) { seen[c] = 1; out.push(c); }
    });
  });
  return out;
}

/* ===================== 유틸 ===================== */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function hanziChars(s) { return String(s || "").replace(/[^一-鿿]/g, "").split(""); }
function el(id) { return document.getElementById(id); }
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

var CUR = null, RT = {};                        /* 커리큘럼 */
var S = { mode: "trace", list: [], idx: 0, rep: 0, weak: false, hard: false, ready: false,
  qs: [], picked: -1, shown: true, marks: [], t0: 0, rd: "text", text: null, newOpen: false,
  reveal: false, qmiss: 0, outline: true, keep: null, spokeIdx: -1, grade: null, keyOpen: false,
  overlay: false, erase: false, showKo: false };

function phase() { return CUR.phases[W.ph]; }
function week() { return phase().weeks[W.wk]; }
function epNo(pi, w) { return pi === 0 ? w.week : CUR.phases[0].weeks.length + w.week; }

/* 그 화에 나오는 한자 — 단어 순서대로, 중복 제거 */
function epChars(w) {
  var seen = {}, out = [];
  w.sessions.forEach(function (sess) {
    sess.target_vocab.forEach(function (v) {
      hanziChars(v.hanzi).forEach(function (c) {
        if (seen[c]) return;
        seen[c] = 1;
        out.push({ ch: c, word: v.hanzi, wordPinyin: v.pinyin, en: v.en || "",
          ex: v.example || null });
      });
    });
  });
  return out;
}
function weakList() {
  var want = {}, out = [];
  weakChars().forEach(function (c) { want[c] = 1; });
  if (!Object.keys(want).length) return out;
  var seen = {};
  CUR.phases.forEach(function (ph) {
    ph.weeks.forEach(function (w) {
      w.sessions.forEach(function (sess) {
        sess.target_vocab.forEach(function (v) {
          hanziChars(v.hanzi).forEach(function (c) {
            if (!want[c] || seen[c]) return;
            seen[c] = 1;
            out.push({ ch: c, word: v.hanzi, wordPinyin: v.pinyin, en: v.en || "", ex: v.example || null });
          });
        });
      });

/* ===================== 읽기 (해독) ===================== */
var READ_N = 12;                       /* 한 세트 문제 수 */
var FLASH_MS = 2500;
var zhVoice = null;
function pickVoice() {
  var vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];

function rkey(zh) { return "r:" + zh; }
function readState(zh) { return W.read[rkey(zh)] || null; }
function koTag(ko) { var m = /^\[([^\]]+)\]\s*/.exec(ko || ""); return m ? m[1] : "나"; }

function shuffle(a) { return a.slice().sort(function () { return Math.random() - 0.5; }); }

/* 그 화의 예문 — 단어 순서대로 */
function epSentences(w) {
  var out = [], seen = {};
  w.sessions.forEach(function (sess) {
    sess.target_vocab.forEach(function (v) {
      var e = v.example;
      if (!e || !e.zh || seen[e.zh]) return;

}
/* 회화앱에서 발음이 낮았던 문장 그대로 */
function weakSentences() {
  var t = talkData(); if (!t) return [];
  return Object.keys(t.missed || {}).map(function (k) {
    var m = t.missed[k] || {};
    return { zh: m.zh, pinyin: m.pinyin || "", ko: m.ko || "", word: "" };
  }).filter(function (x) { return x.zh; });
}

  cs.forEach(function (c) { if (strokeDone(c.ch)) d++; });
  return { done: d, total: cs.length };
}

}

/* ---- 문제 만들기 ---- */
/* 뜻 고르기: 오답은 같은 화에서, 글자가 겹치는 문장을 우선 고른다 */
function meanProblem(s, pool) {
  var mine = koBody(s.ko);
  var cand = pool.filter(function (x) { return x.zh !== s.zh && koBody(x.ko) !== mine; });
  var mych = {};
  hanziChars(s.zh).forEach(function (c) { mych[c] = 1; });
  cand = shuffle(cand).sort(function (a, b) {
    var sa = hanziChars(a.zh).filter(function (c) { return mych[c]; }).length;
    var sb = hanziChars(b.zh).filter(function (c) { return mych[c]; }).length;
    return sb - sa;
  }).slice(0, 3);
  if (cand.length < 3) return null;
  var opts = shuffle([mine].concat(cand.map(function (x) { return koBody(x.ko); })));
  return { kind: "mean", s: s, q: "이 문장은 무슨 뜻일까요", opts: opts, ans: opts.indexOf(mine) };
}
/* 누가 한 말일까: 화자 태그로 만든다 */
function whoProblem(s, pool) {
  var mine = koTag(s.ko), names = {};
  pool.forEach(function (x) { names[koTag(x.ko)] = 1; });
  var others = shuffle(Object.keys(names).filter(function (n) { return n !== mine; })).slice(0, 3);
  if (others.length < 2) return null;
  var opts = shuffle([mine].concat(others));
  return { kind: "who", s: s, q: "누가 한 말일까요", opts: opts, ans: opts.indexOf(mine) };
}

function buildProblems(pool) {
  /* 안 푼 문장 → 틀린 문장 → 맞힌 문장 순서 */
  var fresh = [], bad = [], good = [];
  pool.forEach(function (x) {
    var r = readState(x.zh);
    if (!r) fresh.push(x); else if (r.s < 2) bad.push(x); else good.push(x);
  });
  var order = shuffle(bad).concat(shuffle(fresh));
  if (!W.onlyNew || order.length < READ_N) order = order.concat(shuffle(good));
  var picked = order.slice(0, READ_N), out = [];
  /* 화자 맞히기는 이름표가 붙은 문장으로 — 안 붙은 문장은 답이 늘 '나'라 쉬워진다 */
  var tagged = picked.filter(function (x) { return /^\[/.test(x.ko || ""); });
  var plain = picked.filter(function (x) { return !/^\[/.test(x.ko || ""); });
  for (var i = 0; i < picked.length; i++) {
    var want = (i % 3 === 2), s0 = null, p = null;
    if (want && tagged.length) { s0 = tagged.shift(); p = whoProblem(s0, pool); }
    if (!p) {
      s0 = plain.length ? plain.shift() : tagged.shift();
      if (!s0) break;
      p = meanProblem(s0, pool) || whoProblem(s0, pool);
    }
    if (p) { p.flash = Math.random() < 0.35; out.push(p); }   /* 플래시는 무작위로 */
  }
  return out;
}

function passage(ph, w) { return RT[ph + ":" + w.week] || null; }
function allPassages() {
  var out = [];
  CUR.phases.forEach(function (p, pi) {
    p.weeks.forEach(function (w) { var t = passage(pi, w); if (t) out.push(t); });
  });
  return out;
}
/* 지문 문장으로 만든 뜻 고르기 + 마지막에 글 종류 고르기 */
function textProblems(t) {
  var pool = t.lines.map(function (l) {
    return { zh: l.zh, pinyin: l.pinyin, ko: l.ko, word: "" }; });
  var others = [];
  allPassages().forEach(function (x) {
    if (x !== t) x.lines.forEach(function (l) {
      others.push({ zh: l.zh, pinyin: l.pinyin, ko: l.ko, word: "" }); });
  });
  var qs = [];
  pool.forEach(function (sm) {
    var p = meanProblem(sm, pool.concat(shuffle(others).slice(0, 40)));
    if (p) qs.push(p);
  });
  var gs = {}, mine = t.genre;
  allPassages().forEach(function (x) { if (x.genre !== mine) gs[x.genre] = 1; });
  var others3 = shuffle(Object.keys(gs)).slice(0, 3);
  if (others3.length === 3) {
    var opts = shuffle([mine].concat(others3));
    qs.push({ kind: "genre", s: { zh: t.title, pinyin: t.titlePinyin, ko: t.titleKo },
      q: "이 글은 어떤 글일까요", opts: opts, ans: opts.indexOf(mine) });
  }
  qs.forEach(function (q) { q.flash = q.kind === "mean" && Math.random() < 0.35; });
  return qs;
}

function loadRead() {
  S.text = S.weak ? null : passage(W.ph, week());
  S.rd = S.text ? "text" : "quiz";
  S.newOpen = false;
  var pool = S.weak ? weakSentences() : epSentences(week());
  S.qs = S.text ? textProblems(S.text) : buildProblems(pool);
  S.idx = S.qs.length ? 0 : -2;        /* -2 = 문제 없음, -1 = 결과 */
  S.picked = -1; S.marks = [];
  S.shown = !flashNow(); S.t0 = Date.now();
  if (!S.shown) startFlash();
}

function flashNow() { var q = S.qs && S.qs[S.idx]; return !!(W.flash && q && q.flash); }
var flashT = null;
function startFlash() {
  clearTimeout(flashT);
  S.shown = true;
  flashT = setTimeout(function () {
    if (S.mode !== "read" || S.picked > -1) return;
    S.shown = false; render();
  }, FLASH_MS);
}

function answer(i) {
  var q = S.qs[S.idx];
  if (!q || S.picked > -1) return;
  clearTimeout(flashT);
  S.picked = i; S.shown = true;
  var ok = i === q.ans;
  var prev = readState(q.s.zh);
  W.read[rkey(q.s.zh)] = { s: ok ? 2 : 0, last: Date.now(), n: ((prev && prev.n) || 0) + 1 };
  S.marks.push({ zh: q.s.zh, ko: q.s.ko, pinyin: q.s.pinyin, ok: ok, kind: q.kind,
    sec: Math.round((Date.now() - S.t0) / 1000) });
  save(); render();
  if (ok) speak(q.s.zh);
}

function nextQ() {
  clearTimeout(flashT);
  if (S.idx + 1 < S.qs.length) {
    S.idx++; S.picked = -1; S.t0 = Date.now();
    S.shown = !flashNow(); if (!S.shown) startFlash();
  } else S.idx = -1;
  render();
}

/* ---- 형광펜: 모든 문제 화면에서 글자를 눌러 표시한다 ---- */
function markChar(c) {
  if (!/[一-鿿]/.test(c)) return;
  if (W.hard[c]) delete W.hard[c];
  else W.hard[c] = { n: ((W.hard[c] && W.hard[c].n) || 0) + 1, last: Date.now() };
  save(); render();
}
function hardList() {
  var seen = {}, out = [];
  var want = Object.keys(W.hard);
  if (!want.length) return out;
  want.forEach(function (c) { seen[c] = { ch: c, word: c, wordPinyin: "", en: "", ex: null }; });
  CUR.phases.forEach(function (ph) {
    ph.weeks.forEach(function (w) {
      w.sessions.forEach(function (sess) {
        sess.target_vocab.forEach(function (v) {
          hanziChars(v.hanzi).forEach(function (c) {
            if (seen[c] && !seen[c].wordPinyin)
              seen[c] = { ch: c, word: v.hanzi, wordPinyin: v.pinyin, en: v.en || "", ex: v.example || null };
          });
        });
      });
    });
  });
  want.forEach(function (c) { out.push(seen[c]); });
  return out;
}

/* ---- 화면 ---- */
/* 문장. 글자를 누르면 형광펜, 정답 확인 뒤에는 병음이 함께 보인다 */
function sentHTML(it, withPy) {

  var aligned = toks.length === hz.length;

}

/* ===================== 획순 ===================== */
var STROKES = null, strokesLoading = false;
function ensureStrokes(after) {
  if (STROKES) return after && after();
  if (strokesLoading) return;
  strokesLoading = true;
  fetch("../data/strokes.json").then(function (r) { return r.json(); }).then(function (d) {
    STROKES = d; strokesLoading = false; render();
  }).catch(function () { strokesLoading = false; STROKES = {}; render(); });
}
function charData(c) { return (STROKES && STROKES[c]) ? { strokes: STROKES[c].s, medians: STROKES[c].m } : null; }
function hasStroke(c) { return !!(STROKES && STROKES[c]); }
function strokeDone(c) { return !!(W.stroke[c] && W.stroke[c].ok); }

var HW = { demo: null, quiz: null };
function killWriters() {
  ["demo", "quiz"].forEach(function (k) {
    if (HW[k]) { try { HW[k].cancelQuiz && HW[k].cancelQuiz(); } catch (e) {} HW[k] = null; }
  });
}

function buildStroke() {
  var host = el("cells"), it = S.list[S.idx];
  if (!host || !it) return;
  killWriters();
  host.innerHTML = "";
  if (!STROKES) { ensureStrokes(); return; }
  var data = charData(it.ch);
  if (!data) return;

  var box = host.getBoundingClientRect();
  if (box.width < 60 || box.height < 60) { setTimeout(reflow, 220); return; }
  var size = Math.floor(Math.min(box.height, (box.width - 22) / 2));
  var ink = ink_model();
  ["demo", "quiz"].forEach(function (kind, i) {
    var cell = document.createElement("div");
    cell.className = "hwcell";
    cell.id = "hw-" + kind;
    cell.style.width = size + "px"; cell.style.height = size + "px";
    var tag = document.createElement("span");
    tag.className = "tagline";
    tag.textContent = i === 0 ? "획순 보기" : "따라 쓰기";
    cell.appendChild(tag);
    host.appendChild(cell);
  });

  var common = { width: size, height: size, padding: Math.round(size * 0.07),
    strokeColor: ink, radicalColor: isDark() ? "#ff6b60" : "#e5322a", drawingColor: ink,
    strokeAnimationSpeed: 1, delayBetweenStrokes: 220,
    charDataLoader: function (c, onLoad) { onLoad(charData(c)); } };

  HW.demo = HanziWriter.create("hw-demo", it.ch, Object.assign({}, common, { showOutline: true }));
  HW.demo.animateCharacter();
  HW.quiz = HanziWriter.create("hw-quiz", it.ch, Object.assign({}, common, {
    showCharacter: false, showOutline: S.outline !== false, showHintAfterMisses: 2,
    highlightOnComplete: true, drawingWidth: Math.round(size * 0.05)
  }));
  S.qmiss = 0;
  HW.quiz.quiz({
    onMistake: function (d) { S.qmiss = d.totalMistakes; strokeStatus(d.strokesRemaining, false); },
    onCorrectStroke: function (d) { strokeStatus(d.strokesRemaining, false); },
    onComplete: function (d) {
      var rec = W.stroke[it.ch] || (W.stroke[it.ch] = { ok: false, miss: 0, n: 0 });
      rec.ok = true; rec.n++; rec.miss += d.totalMistakes; rec.last = Date.now();
      save(); strokeStatus(0, true);
    }
  });
  strokeStatus(data.strokes.length, false);
}
function ink_model() { return ink("model"); }

function strokeStatus(left, done) {
  var it = S.list[S.idx];
  var total = (hasStroke(it.ch) && charData(it.ch)) ? charData(it.ch).strokes.length : 0;
  var g = el("hwgauge");
  if (g) {
    var made = total - left, out = "";
    for (var i = 0; i < total; i++)
      out += '<i class="' + (i < made - 1 ? "d" : i === made - 1 ? "c" : "") + '"></i>';
    g.innerHTML = out;
  }
  var n = el("hwstat");
  if (n) n.textContent = done ? (S.qmiss ? "다 썼어요 · 틀린 획 " + S.qmiss : "한 번에 맞았어요")
    : ("남은 획 " + left + (S.qmiss ? " · 틀림 " + S.qmiss : ""));
  var b = el("nextbtn");
  if (b && done) b.disabled = false;
}

function strokeHTML(it) {
  var h = '<div class="stage"><div class="hwrow" id="cells"></div>';
  if (!STROKES) h += '<p class="hintline" style="padding-top:14px">획순 데이터를 불러오는 중</p>';
  else if (!hasStroke(it.ch)) h += '<p class="hintline" style="padding-top:14px">이 글자는 획순 데이터가 없습니다</p>';
  else h += '<div class="gline"><span class="gauge" id="hwgauge"></span>'
    + '<span class="muted" id="hwstat"></span></div>';
  return h + '<div class="footrow">'
    + '<button class="pill" data-a="hwclear">다시 쓰기</button>'

    + (S.idx + 1 < S.list.length ? "다음 글자" : "마치기") + "</button></div></div>";
}

function buildDictCells() {
  var host = el("cells"), it = S.list[S.idx];

  pad.redraw();
  pads.push(pad);

/* 듣기 표시용 파형 — 문장 길이에 따라 막대 수가 달라진다 */
function paintWave(zh) {
  var w = el("wave");
  if (!w) return;
  var n = Math.max(24, Math.min(64, hanziChars(zh).length * 4));
  var out = "";
  for (var i = 0; i < n; i++) {
    var h = 5 + Math.round(Math.abs(Math.sin(i * 0.8 + zh.length)) * 17);
    out += '<i style="height:' + h + 'px"></i>';

  w.innerHTML = out;
}

function dictMark(score) {

/* ===================== 글씨 채점 ===================== */
/* 1) 본보기와 겹쳐 보는 기하 채점 — 인터넷도 키도 필요 없다
   2) Gemini 에 그림을 보내 글씨체 평가를 받는다 (키가 있을 때) */

/* 이 앱의 채점은 받아쓰기(문장)에서만 한다 */

/* Gemini 키 — 이 앱에 넣은 값이 없으면 회화앱 것을 빌려 쓴다 */
function gmKey() {
  if (W.gmKey) return W.gmKey;
  var t = talkData();
  return (t && t.gmKey) || "";
}
var GM_URL = "https://generativelanguage.googleapis.com/v1beta/models";

/* ---- 문장(받아쓰기) 채점 ---- */
var SENT_SCHEMA = {
  type: "OBJECT",
  properties: {
    score: { type: "INTEGER" }, shape: { type: "INTEGER" }, layout: { type: "INTEGER" },
    wrong: { type: "STRING" }, good: { type: "STRING" },
    tips: { type: "ARRAY", items: { type: "STRING" } }
  },
  required: ["score", "shape", "layout", "wrong", "good", "tips"]
};

/* 공책에 쓴 글씨 + 아래에 인쇄체 정답 */
function noteImage(pad, zh) {
  var W0 = Math.min(760, Math.round(pad.size));
  var k = W0 / pad.size, H0 = Math.round(pad.h * k);
  var foot = 76;
  var cv = document.createElement("canvas");
  cv.width = W0; cv.height = H0 + foot;
  var c = cv.getContext("2d");
  c.fillStyle = "#fff"; c.fillRect(0, 0, cv.width, cv.height);
  c.save();
  c.scale(k, k);
  c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = "#111"; c.fillStyle = "#111";
  pad.strokes.forEach(function (st) {
    var p = st.pts;
    if (p.length === 1) { c.beginPath(); c.arc(p[0].x, p[0].y, p[0].w / 2, 0, 6.2832); c.fill(); return; }
    for (var i = 1; i < p.length; i++) {
      c.beginPath();
      c.lineWidth = (p[i - 1].w + p[i].w) / 2;
      c.moveTo(p[i - 1].x, p[i - 1].y);
      c.quadraticCurveTo(p[i - 1].x, p[i - 1].y, (p[i - 1].x + p[i].x) / 2, (p[i - 1].y + p[i].y) / 2);
      c.lineTo(p[i].x, p[i].y);
      c.stroke();
    }
  });
  c.restore();
  c.strokeStyle = "#ccc"; c.beginPath();
  c.moveTo(0, H0 + .5); c.lineTo(W0, H0 + .5); c.stroke();
  c.fillStyle = "#888"; c.font = "13px sans-serif"; c.textAlign = "left";
  c.fillText("MODEL", 10, H0 + 20);
  c.fillStyle = "#111";
  var fs = Math.min(34, Math.floor((W0 - 30) / Math.max(1, zh.length) * 1.0));
  c.font = fs + 'px "HandZh","Kaiti SC","PingFang SC",serif';
  c.textBaseline = "alphabetic";
  c.fillText(zh, 12, H0 + foot - 14);
  return cv.toDataURL("image/png");
}

async function aiGradeSentence(pad, zh) {
  var key = gmKey();
  if (!key) throw { msg: "Gemini 키가 없습니다. 왼쪽 아래 설정에서 넣어주세요." };
  var img = noteImage(pad, zh).split(",")[1];
  var prompt = "위쪽은 중국어를 배우는 한국인 학습자가 공책에 손으로 받아쓴 문장이고, "
    + "아래쪽 MODEL 은 정답 문장입니다. 정답은 「" + zh + "」입니다. 위쪽 손글씨를 평가하세요.\n\n"
    + "- shape: 자형. 각 글자의 획과 모양이 맞는가 (0~100)\n"
    + "- layout: 줄 맞춤과 글자 크기·간격의 일관성 (0~100)\n"
    + "- score: 전체 점수 (0~100). 인쇄체처럼 반듯할 필요는 없고, 읽기 좋고 자형이 맞으면 높게 줍니다.\n"
    + "- wrong: 틀리게 썼거나 빠진 글자만 이어서 쓰세요. 없으면 빈 문자열.\n"
    + "- good: 잘한 점 한 줄, 한국어 25자 이내\n"
    + "- tips: 고칠 점 2~3개, 각각 한국어 30자 이내. 어떤 글자의 어느 부분인지 구체적으로.\n\n"
    + "손글씨를 읽기 어려우면 추측하지 말고 tips 에 그렇게 쓰세요. JSON 객체 하나만 출력하세요.";
  var models = [W.gmModel || "gemini-3.6-flash", "gemini-flash-latest"];
  var res = null, lastErr = "";
  for (var i = 0; i < models.length; i++) {
    try {
      res = await fetch(GM_URL + "/" + models[i] + ":generateContent?key=" + encodeURIComponent(key), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [
            { inline_data: { mime_type: "image/png", data: img } }, { text: prompt }] }],
          generationConfig: { responseMimeType: "application/json", responseSchema: SENT_SCHEMA }
        })
      });
    } catch (e) { throw { msg: "인터넷 연결을 확인하세요." }; }
    if (res.ok) break;
    lastErr = res.status;
    if (res.status !== 404) break;
  }
  if (!res || !res.ok) {
    if (lastErr === 429) throw { msg: "Gemini 호출 한도를 넘었습니다." };
    if (lastErr === 400 || lastErr === 403) throw { msg: "Gemini 키를 확인하세요." };
    throw { msg: "Gemini 오류 " + lastErr };
  }
  var data = await res.json();
  var parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];
  var text = parts.map(function (p) { return p.text || ""; }).join("").replace(/```json|```/g, "").trim();
  try { return JSON.parse(text); }
  catch (e) { throw { msg: "응답을 읽지 못했습니다." }; }
}

function gradeSentence() {
  var it = S.list[S.idx], pad = pads[0];
  if (!it || !pad || pad.empty()) return;
  if (!gmKey()) { S.grade = { local: null, ai: null, busy: false,
    err: "Gemini 키가 있어야 문장 채점이 됩니다." }; return render(); }
  S.grade = { local: null, ai: null, sent: true, busy: true, err: "" };
  render();
  aiGradeSentence(pad, it.zh).then(function (r) {
    if (!S.grade) return;
    S.grade.ai = r; S.grade.busy = false; render();
  }).catch(function (e) {
    if (!S.grade) return;
    S.grade.busy = false; S.grade.err = (e && e.msg) || "채점하지 못했습니다."; render();
  });
}

function gradeHTML() {
  var g = S.grade;
  if (!g) return "";
  var h = '<div class="gradebox">';
  if (g.local) {
    h += '<span class="gsc"><b>' + g.local.score + "</b>모양 맞춤</span>"
      + '<span class="gsub">덮음 ' + g.local.cover + " · 벗어남 " + (100 - g.local.clean)
      + " · 크기 " + g.local.size + "</span>";
  }
  if (g.busy) h += '<span class="gsub"><span class="spin"></span>글씨체 평가 중</span>';
  if (g.err) h += '<span class="gsub err">' + esc(g.err) + "</span>";
  if (g.ai) {
    h += '<span class="gsc ai"><b>' + g.ai.score + "</b>글씨체</span>"
      + '<span class="gsub">자형 ' + g.ai.shape
      + (g.sent ? " · 줄 맞춤 " + g.ai.layout : " · 균형 " + g.ai.balance) + "</span>";
    if (g.sent && g.ai.wrong)
      h += '<span class="gsub err">틀린 글자 ' + esc(g.ai.wrong) + "</span>";
  }
  h += "</div>";
  var tips = (g.ai ? g.ai.tips : (g.local ? g.local.tips : [])) || [];
  if (g.ai && g.ai.good) h += '<p class="gtip good">' + esc(g.ai.good) + "</p>";
  tips.slice(0, 3).forEach(function (t) { h += '<p class="gtip">' + esc(t) + "</p>"; });
  return h;
}

/* ===================== 화면 ===================== */
var PEN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l1-4.5L15.6 4.9a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L7.5 20 3 21z" '

var ERASER_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 19H20M4.6 15.6l6-6a2 2 0 0 1 2.8 0l4 4a2 2 0 0 1 0 2.8L15.4 19H9.4l-4.8-4.8a1 1 0 0 1 0-1.4z" '

var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">'

function toolsHTML(extra) {

    + '<button class="tool' + (S.erase ? "" : " on") + '" data-a="pen" aria-label="펜">' + PEN_SVG + "</button>"

}

/* ── 진도 ── */
function modeProgress(w) {
  return S.mode === "read" ? epReadProgress(w)
    : S.mode === "dict" ? epDictProgress(w)
    : S.mode === "stroke" ? epStrokeProgress(w) : epProgress(w);
}
function unitWord() {
  return S.mode === "trace" || S.mode === "stroke" ? "자" : "문장";
}

/* ── 2행 : 화 선택 ── */
function epbarHTML() {
  var read = S.mode === "read";
  var weak = read ? weakSentences() : weakList();
  var h = '<div class="epbar">';
  if (S.mode === "trace" && Object.keys(W.hard).length)
    h += '<button class="epbtn flag ' + (S.hard ? "on" : "") + '" data-a="hard">표시 '
      + Object.keys(W.hard).length + "자</button>";
  if (weak.length)
    h += '<button class="epbtn flag ' + (S.weak ? "on" : "") + '" data-a="weak">약점 '
      + weak.length + (read ? "문장" : "자") + "</button>";
  phase().weeks.forEach(function (w, i) {
    var pr = modeProgress(w), on = !S.weak && !S.hard && i === W.wk;
    var n = epNo(W.ph, w);
    var lab = on ? (n + "화 " + (w.episode ? w.episode.title : w.week + "주차")) : (n + "화");
    h += '<button class="epbtn ' + (on ? "on " : "") + (pr.done ? "done" : "") + '" data-a="wk" data-i="'
      + i + '">' + esc(lab) + "</button>";

    var p = modeProgress(week());
    var pct = p.total ? Math.round(p.done / p.total * 100) : 0;
    h += '<span class="prog"><span class="mini"><i style="width:' + pct + '%"></i></span>'
      + p.done + " / " + p.total + unitWord() + "</span>";
  }
  h += '<button class="pill" data-a="onlynew">'
    + (W.onlyNew ? "안 푼 것만" : "전체") + "</button>"
    + '<button class="pill" data-a="theme">'
    + (W.theme === "dark" ? "어둡게" : W.theme === "light" ? "밝게" : "자동") + "</button>";
  return h + "</div>";
}

/* ── 좌 : 설명 칸 ── */
function chipsHTML() {
  return '<div class="chips">' + S.list.map(function (c, i) {
    var cls = "chip zh" + (i === S.idx ? " now"
      : (S.mode === "stroke" ? strokeDone(c.ch) : charDone(c.ch)) ? " done" : "")

function keyHTML() {

}

function sideHTML() {
  var h = "";

    var it = S.list[S.idx];
    if (!it) return '<p class="muted">글자가 없습니다</p>';

    h += '<div class="glyphbig zh">' + esc(it.ch) + "</div>"
      + '<div class="py">' + esc(it.wordPinyin) + "</div>"
      + '<div class="ko zh">' + esc(it.word) + "</div>"
      + (it.en ? '<div class="en">' + esc(it.en) + "</div>" : "");
    h += '<div class="facts">';
    if (S.mode === "stroke")
      h += '<div class="fact"><span>획수</span><b>' + (total ? total + "획" : "—") + "</b></div>"
        + '<div class="fact"><span>틀린 획</span><b>' + (S.qmiss || 0) + "</b></div>";
    else
      h += '<div class="fact"><span>쓴 횟수</span><b>' + ((W.chars[it.ch] && W.chars[it.ch].n) || 0) + "</b></div>"
        + '<div class="fact"><span>이번에 쓴 칸</span><b>' + S.rep + " / " + REPS + "</b></div>";
    h += "</div>";
    h += '<div class="track"><div class="cap">'
      + (S.hard ? "표시한 글자" : S.weak ? "약점 글자" : epNo(W.ph, week()) + "화의 글자")
      + " · " + (S.idx + 1) + "/" + S.list.length + "</div>" + chipsHTML() + "</div>";
    h += S.mode === "stroke"
      ? '<div class="tools"><button class="tool" data-a="hwplay" aria-label="다시 보기">' + PLAY_SVG + "</button>"
        + '<button class="tool" data-a="hwhint" aria-label="힌트">' + HINT_SVG + "</button></div>"
      : toolsHTML();
  } else if (S.mode === "dict") {
    var d = S.list[S.idx];
    h += '<div class="cap">받아쓰기 · ' + (S.list.length ? (S.idx + 1) + " / " + S.list.length : "0") + "</div>";
    h += '<div class="lead" style="margin-top:10px">'
      + (d ? (S.reveal || S.showKo ? esc(koBody(d.ko)) : "듣고 받아 적기") : "문장이 없습니다") + "</div>";
    if (d) {
      h += '<div class="facts">'
        + '<div class="fact"><span>글자 수</span><b>' + hanziChars(d.zh).length + "자</b></div>"
        + '<div class="fact"><span>맞힌 문장</span><b>'
        + S.list.filter(function (x) { return dictDone(x.zh); }).length + " / " + S.list.length + "</b></div></div>";
      h += '<div class="track"><div class="cap">'
        + (S.weak ? "약점 문장" : epNo(W.ph, week()) + "화의 문장") + '</div><div class="slist">'
        + S.list.map(function (x, i) {
            return '<button class="srow ' + (i === S.idx ? "on " : "") + (dictDone(x.zh) ? "done" : "")
              + '" data-a="jump" data-i="' + i + '"><span class="n">' + (i + 1) + "</span>"
              + '<span class="t">' + esc(koBody(x.ko)) + "</span></button>"; }).join("")
        + "</div></div>";
    }
    h += toolsHTML();
  } else {
    var t = S.text;
    h += '<div class="cap">' + esc(t ? t.genre : "읽기") + "</div>";
    h += '<div class="lead zh" style="margin-top:9px">' + esc(t ? t.title : "문장 해독") + "</div>";
    if (t && t.koTitle) h += '<div class="en" style="margin-top:8px">' + esc(t.koTitle) + "</div>";
    h += '<div class="facts">'
      + '<div class="fact"><span>새 글자</span><b>' + (t && t["new"] ? t["new"].length : 0) + "자</b></div>"
      + '<div class="fact"><span>맞힘</span><b>'
      + S.marks.filter(function (m) { return m.ok; }).length + " / " + (S.qs ? S.qs.length : 0) + "</b></div></div>";
    if (S.qs && S.qs.length) {
      h += '<div class="track"><div class="cap">문제 '
        + (S.idx < 0 ? S.qs.length : S.idx + 1) + " / " + S.qs.length + '</div><div class="qdots">'
        + S.qs.map(function (q, i) {
            var m = S.marks[i], cls = "qdot";
            if (i === S.idx) cls += " now"; else if (m) cls += m.ok ? " done" : " miss";
            return '<span class="' + cls + '">' + (i + 1) + "</span>"; }).join("")
        + "</div></div>";
    }
    h += '<div class="tools"><button class="pill" data-a="flash">'
      + (W.flash ? "플래시 켜짐" : "플래시") + "</button></div>";
  }
  return h + keyHTML();
}

/* ── 우 : 작업 영역 ── */
function mainHTML() {
  var h = '<div class="tabs">'
    + [["trace", "따라 쓰기"], ["stroke", "획순"], ["dict", "받아쓰기"], ["read", "읽기"]]
        .map(function (m) {
          return '<button class="mode ' + (S.mode === m[0] ? "on" : "") + '" data-a="mode" data-m="'
            + m[0] + '">' + m[1] + "</button>"; }).join("")
    + '<span class="spacer"></span><div class="seg">'
    + CUR.phases.map(function (p, i) {
        return '<button class="seg-b ' + (i === W.ph ? "on" : "") + '" data-a="ph" data-i="' + i + '">'
          + (i === 0 ? "1–3급" : "4급") + "</button>"; }).join("")
    + "</div></div>";

  h += epbarHTML();
  h += '<div class="body"><div class="side">' + sideHTML() + '</div><div class="main">';

  if (S.mode === "read") return h + readHTML() + "</div></div>";
  var it = S.list[S.idx];
  if (S.list.length && S.mode === "stroke") return h + strokeHTML(it) + "</div></div>";
  if (S.list.length && S.mode === "dict") return h + dictHTML(it) + "</div></div>";
  if (!S.list.length)
    return h + '<div class="stage"><div class="center"><p class="muted">'
      + (S.mode === "dict" ? "이 화에는 받아쓸 문장이 없습니다."
         : S.hard ? "읽기에서 표시한 글자가 아직 없습니다."
         : S.weak ? "회화앱에서 약했던 글자가 아직 없습니다." : "이 화에는 연습할 글자가 없습니다.")
      + "</p></div></div></div></div>";

  h += '<div class="stage">'
    + '<div class="cellwrap-row"><div class="cells" id="cells"></div></div>'
    + '<div class="footrow">'
    + '<button class="pill" data-a="undo">한 획 지우기</button>'
    + '<button class="pill" data-a="clear">모두 지우기</button>'
    + '<span class="spacer"></span>'
    + '<button class="pill" data-a="prev"' + (S.idx ? "" : " disabled") + '>이전</button>'
    + '<button class="pill solid" id="nextbtn" data-a="next" disabled>'
    + (S.idx + 1 < S.list.length ? "다음 글자" : "마치기") + "</button></div></div>";
  return h + "</div></div>";
}

function buildCells() {
  var host = el("cells");
  if (!host) return;
  var it = S.list[S.idx];
  pads = [];
  host.innerHTML = "";
  var box = host.getBoundingClientRect();
  if (box.width < 60 || box.height < 60) { setTimeout(reflow, 220); return; }
  var size = Math.floor(Math.min(box.width, box.height) / 2) - 1;
  for (var i = 0; i < REPS + 1; i++) {
    var wrap = document.createElement("div");
    wrap.className = "cellwrap";
    var cv = document.createElement("canvas");
    cv.className = "cell";
    cv.style.width = size + "px"; cv.style.height = size + "px";
    wrap.appendChild(cv);
    if (i === 0) {
      var tag = document.createElement("span");
      tag.className = "tagline";
      tag.textContent = "본보기";
      wrap.appendChild(tag);
    }
    host.appendChild(wrap);
    var pad = makePad(cv, i === 0 ? 1 : GHOST[i - 1], it.ch);
    pad.resize();
    if (i > 0) pads.push(pad);
  }
}

function render() {
  if (S.mode !== "stroke") killWriters();
  document.body.classList.toggle("erasing", !!S.erase);
  document.getElementById("app").innerHTML = mainHTML();
  if (S.mode === "trace") buildCells();
  else if (S.mode === "stroke") buildStroke();
  else if (S.mode === "dict") buildDictCells();
}

function loadList() {
  if (S.mode === "read") return loadRead();
  if (S.mode === "dict") return loadDict();
  var all = S.hard ? hardList() : S.weak ? weakList() : epChars(week());
  if (S.mode === "stroke") {
    ensureStrokes();
    var withData = all.filter(function (c) { return !STROKES || hasStroke(c.ch); });
    var left = withData.filter(function (c) { return !strokeDone(c.ch); });
    S.list = (W.onlyNew && left.length) ? left : withData;
    S.idx = 0; S.qmiss = 0;
    return;
  }
  var fresh = all.filter(function (c) { return !charDone(c.ch); });
  S.list = (W.onlyNew && fresh.length) ? fresh : all;
  S.idx = 0; S.rep = 0;
}

function nextChar() {
  var it = S.list[S.idx];
  S.grade = null;
  var rec = W.chars[it.ch] || (W.chars[it.ch] = { n: 0, last: 0 });
  var drawn = pads.filter(function (p) { return !p.empty(); }).length;
  rec.n += drawn; rec.last = Date.now();
  save();
  if (S.idx + 1 < S.list.length) { S.idx++; S.rep = 0; render(); }
  else { S.idx = 0; S.rep = 0; render(); }
}

/* ===================== 이벤트 ===================== */
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-a]");
  if (!t || t.disabled) return;
  var a = t.getAttribute("data-a");
  if (a === "ph") { W.ph = +t.getAttribute("data-i"); W.wk = 0; S.weak = false; S.hard = false;
    save(); loadList(); return render(); }
  if (a === "wk") { W.wk = +t.getAttribute("data-i"); S.weak = false; S.hard = false;
    save(); loadList(); return render(); }
  if (a === "weak") { S.weak = true; S.hard = false; loadList(); return render(); }
  if (a === "hard") { S.hard = true; S.weak = false; S.mode = "trace"; loadList(); return render(); }
  if (a === "tohard") { S.mode = "trace"; S.hard = true; S.weak = false; loadList(); return render(); }
  if (a === "pick") return answer(+t.getAttribute("data-i"));
  if (a === "nextq") return nextQ();
  if (a === "again") { S.shown = true; render(); return startFlash(); }
  if (a === "flash") { W.flash = !W.flash; save(); S.shown = true; clearTimeout(flashT); return render(); }
  if (a === "mark") return markChar(t.getAttribute("data-c"));
  if (a === "mode") { S.mode = t.getAttribute("data-m"); S.weak = false; S.hard = false;
    loadList(); return render(); }
  if (a === "say") return speak(t.getAttribute("data-t"));
  if (a === "slow") return speak(t.getAttribute("data-t"), 0.6);
  if (a === "hwplay") { if (HW.demo) HW.demo.animateCharacter(); return; }
  if (a === "hwhint") { if (HW.demo) HW.demo.animateCharacter(); return; }
  if (a === "hwclear") { return buildStroke(); }
  if (a === "dreveal") { S.reveal = true; return render(); }
  if (a === "doverlay") { S.overlay = !S.overlay; return render(); }
  if (a === "dko") { S.showKo = !S.showKo; return render(); }
  if (a === "pen") { if (!S.erase) return; S.erase = false; return render(); }
  if (a === "eraser") { if (S.erase) return; S.erase = true; return render(); }
  if (a === "dgrade") return gradeSentence();
  if (a === "dmark") { return dictMark(+t.getAttribute("data-s")); }
  if (a === "dclear") { S.grade = null; S.dstrokes = []; return render(); }
  if (a === "toquiz") { S.rd = "quiz"; S.idx = S.qs.length ? 0 : -2; S.picked = -1; S.marks = [];
    S.t0 = Date.now(); S.shown = !flashNow(); if (!S.shown) startFlash(); return render(); }
  if (a === "totext") { S.rd = "text"; return render(); }
  if (a === "newchars") { S.newOpen = !S.newOpen; return render(); }
  if (a === "readagain") { loadRead(); return render(); }
  if (a === "theme") {
    W.theme = W.theme === "auto" ? "light" : W.theme === "light" ? "dark" : "auto";
    save(); applyTheme(); return render();
  }
  if (a === "onlynew") { W.onlyNew = !W.onlyNew; save(); loadList(); return render(); }
  if (a === "undo") { for (var i = pads.length - 1; i >= 0; i--) if (!pads[i].empty()) { pads[i].undo(); break; } return onDraw(); }
  if (a === "clear") { S.grade = null; pads.forEach(function (p) { p.clear(); }); render(); return onDraw(); }
  if (a === "keypanel") { S.keyOpen = !S.keyOpen; return render(); }
  if (a === "savekey") {
    var box = document.getElementById("gmkey");
    W.gmKey = box ? box.value.trim() : ""; save(); S.keyOpen = false; return render();
  }
  if (a === "jump") {
    var j = +t.getAttribute("data-i");
    if (j === S.idx) return;
    S.idx = j; S.rep = 0; S.qmiss = 0; S.reveal = false; S.overlay = false;
    S.grade = null; S.dstrokes = [];
    return render();
  }
  if (a === "prev") { if (S.idx) { S.idx--; S.rep = 0; S.qmiss = 0; S.reveal = false; S.overlay = false;
    S.grade = null; S.dstrokes = []; render(); } return; }
  if (a === "next") {
    if (S.mode === "stroke") {
      if (S.idx + 1 < S.list.length) { S.idx++; S.qmiss = 0; } else { S.idx = 0; S.qmiss = 0; }
      return render();
    }
    return nextChar();
  }
});
/* 받아쓰기 본보기에 쓰는 손글씨체(楷体)를 미리 불러온다 — 캔버스는 로드된 폰트만 쓴다 */
if (window.FontFace) {
  try {
    var handFace = new FontFace("HandZh", 'url(../fonts/HandZh.woff2)');
    handFace.load().then(function (f) { document.fonts.add(f); if (S.ready) render(); }).catch(function () {});
  } catch (e) {}
}
/* 세로↔가로 전환 때 칸 크기를 다시 잡는다 — 쓴 획은 유지한다 */
var reflowT = null;
function reflow() {
  if (!S.ready) return;
  clearTimeout(reflowT);
  reflowT = setTimeout(function () {
    if (pads.some(function (p) { return p.cur; })) return;   /* 쓰는 중이면 미룬다 */
    if (S.mode === "trace") {
      var keep = pads.map(function (p) { return p.strokes; });
      buildCells();
      pads.forEach(function (p, i) { if (keep[i] && keep[i].length) { p.strokes = keep[i]; p.redraw(); } });
      onDraw();
    } else if (S.mode === "stroke") buildStroke();
    else if (S.mode === "dict") buildDictCells();
  }, 160);
}
window.addEventListener("resize", reflow);
window.addEventListener("orientationchange", function () { reflow(); setTimeout(reflow, 500); });
if (window.visualViewport) window.visualViewport.addEventListener("resize", reflow);
if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme:dark)");
  var onScheme = function () { applyTheme(); if (S.ready) render(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

/* 애플펜슬의 더블탭·스퀴즈는 웹에서 받을 수 없다.
   대신 쓰는 칸을 두 손가락으로 톡 치면 펜↔지우개가 바뀐다 */
var twoTouch = 0;
document.addEventListener("touchstart", function (ev) {
  if (!ev.target.closest || !ev.target.closest(".cell,.note")) return;
  if (ev.touches.length === 2) twoTouch = Date.now();
}, { passive: true });
document.addEventListener("touchend", function (ev) {
  if (!twoTouch) return;
  var quick = Date.now() - twoTouch < 400;
  twoTouch = 0;
  if (!quick || ev.touches.length) return;
  if (S.mode !== "trace" && S.mode !== "dict") return;
  S.erase = !S.erase; render();
}, { passive: true });
document.addEventListener("keydown", function (ev) {
  if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;
  var k = ev.key.toLowerCase();
  if (k === "e" && (S.mode === "trace" || S.mode === "dict")) { S.erase = !S.erase; render(); }
});
