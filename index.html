<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceef4">
<title>전화 중국어</title>
<style>
:root{
  --bg:#eceef4; --ink:#12131a; --ink2:rgba(60,60,67,.68); --ink3:rgba(60,60,67,.48);
  --red:#e5322a; --green:#1f8f3d; --amber:#8a5200; --blue:#0a58c8;
  --line:rgba(16,18,28,.09); --glass:.62; --edge:.72;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.aurora i{position:absolute;border-radius:50%;filter:blur(64px);display:block;}
.b1{width:330px;height:330px;background:#ff9a86;top:-85px;left:-75px;opacity:.6;}
.b2{width:290px;height:290px;background:#93bcff;top:36%;right:-100px;opacity:.55;}
.b3{width:330px;height:330px;background:#ffd694;bottom:-100px;left:6%;opacity:.55;}

.screen{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(22px + env(safe-area-inset-top)) 18px calc(116px + env(safe-area-inset-bottom));}
.head{padding:14px 4px 18px;}
.kicker{margin:0 0 6px;font-size:13px;color:var(--ink2);}
.picker{border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;padding:0;}
.caret{width:6px;height:6px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);
  transform:rotate(45deg) translateY(-2px);display:block;}
.title{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.022em;}
.sub{margin:4px 0 0;font-size:14px;color:var(--ink2);line-height:1.45;}
.ok{color:var(--green);}
.foot{font-size:12px;color:rgba(60,60,67,.62);line-height:1.55;margin-top:12px;}

.glass{background:rgba(255,255,255,var(--glass));
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:.5px solid rgba(255,255,255,var(--edge));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(16,18,28,.05),
    0 10px 28px rgba(16,18,28,.09);}
.card{border-radius:26px;padding:20px;margin-bottom:14px;}
.center{text-align:center;}

.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.hero-n{margin:0;font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;}
.hero-d{font-size:20px;color:var(--ink3);font-weight:600;}
svg.ring{transform:rotate(-90deg);}
.ring-bg{stroke:rgba(16,18,28,.1);}
.ring-fg{stroke:var(--red);transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.6);border:.5px solid var(--line);}

.action{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;
  text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .18s cubic-bezier(.4,0,.2,1);}
.action:active{transform:scale(.975);}
.action-t{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;}
.action.quiet .action-t{font-size:16px;}
.play{width:44px;height:44px;border-radius:50%;background:var(--red);flex:none;position:relative;}
.play::after{content:"";position:absolute;top:50%;left:52%;transform:translate(-50%,-50%);
  border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;}
.arrow{width:9px;height:9px;border-right:2px solid var(--ink3);border-top:2px solid var(--ink3);
  transform:rotate(45deg);flex:none;}
.tick{width:20px;height:20px;border-radius:50%;background:var(--green);flex:none;position:relative;}
.tick::after{content:"";position:absolute;top:5px;left:6px;width:5px;height:9px;
  border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(42deg);}

.sessions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:20px;width:100%;
  text-align:left;color:inherit;font:inherit;cursor:pointer;}
.row-n{width:28px;height:28px;border-radius:50%;background:rgba(16,18,28,.06);
  display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;}
.row-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.row-t{font-size:15px;font-weight:500;font-family:"PingFang SC","Noto Sans SC",sans-serif;}

.tabbar{position:fixed;z-index:4;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;
  border-radius:999px;width:max-content;}
.tab{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;
  padding:9px 20px;border-radius:999px;cursor:pointer;transition:all .2s;
  white-space:nowrap;flex:none;}
.tab.sel{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,18,28,.14);}

.dhead{display:flex;align-items:center;gap:12px;padding:6px 4px 20px;}
.bar{flex:1;height:4px;border-radius:999px;background:rgba(16,18,28,.1);overflow:hidden;}
.bar-fill{height:100%;background:var(--red);border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1);}
.count{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;}
.ghost{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:15px;cursor:pointer;padding:4px 2px;}
.ghost.wide{display:block;width:100%;text-align:center;padding:12px;margin-top:10px;}

.prompt{padding:24px 20px;text-align:center;}
.wordchip{display:inline-block;margin:12px 0 0;padding:6px 13px;border-radius:999px;font-size:13px;
  color:var(--ink2);background:rgba(255,255,255,.62);border:.5px solid var(--line);}
.wc-h{font-family:"PingFang SC","Noto Sans SC",sans-serif;font-size:15px;color:var(--ink);font-weight:600;}
.hanzi{margin:16px 0 8px;font-size:36px;font-weight:600;letter-spacing:.04em;line-height:1.3;
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;}
.hanzi.small{font-size:26px;margin:10px 0 6px;}
.hanzi.tiny{font-size:17px;margin:0;}
.pinyin{margin:0 0 6px;font-size:15px;color:var(--ink2);letter-spacing:.02em;}
.pinyin.tiny{font-size:13px;margin:2px 0 0;}
.t1{color:#c8102e;}.t2{color:#8a6100;}.t3{color:#1a7f37;}.t4{color:#0a58c8;}.t5{color:rgba(60,60,67,.5);}
.hintline{margin:16px 0 0;font-size:14px;color:var(--amber);line-height:1.5;font-weight:500;}
.reveal{margin-top:14px;padding:14px;border-radius:18px;background:rgba(255,255,255,.62);
  border:.5px solid var(--line);}

.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.pill{margin-top:16px;border:.5px solid var(--line);background:rgba(255,255,255,.66);
  color:var(--ink);font:inherit;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer;}
.pill.solid{background:var(--red);border-color:transparent;color:#fff;font-weight:600;}
.pill.danger{color:var(--red);}
.wide-pill{display:block;width:100%;}

.scores{display:flex;gap:10px;justify-content:center;margin:4px 0 2px;flex-wrap:wrap;}
.sc{flex:1;min-width:62px;padding:12px 4px;border-radius:18px;background:rgba(255,255,255,.6);
  border:.5px solid var(--line);}
.sc b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.sc span{display:block;font-size:11px;color:var(--ink2);margin-top:4px;}
.sylrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px;}
.syl{padding:9px 4px 7px;border-radius:14px;min-width:46px;
  border:1px solid var(--line);background:rgba(255,255,255,.55);}
.syl .h{display:block;font-size:21px;font-weight:600;line-height:1.2;
  font-family:"PingFang SC","Noto Sans SC",sans-serif;}
.syl .p{display:block;font-size:10px;color:var(--ink2);margin-top:3px;letter-spacing:.01em;}
.syl.good{border-color:rgba(31,143,61,.45);background:rgba(52,199,89,.17);}
.syl.mid{border-color:rgba(160,110,0,.4);background:rgba(255,204,0,.22);}
.syl.bad{border-color:rgba(229,50,42,.42);background:rgba(255,69,58,.14);}
.weak{margin:14px 0 0;font-size:14px;color:var(--amber);line-height:1.55;}

.verdict{text-align:center;padding:20px;}
.verdict-t{margin:0;font-size:19px;font-weight:600;}
.pass .verdict-t{color:var(--green);}
.close .verdict-t{color:var(--amber);}
.fail .verdict-t{color:var(--red);}
.heard{margin:8px 0 12px;font-size:14px;color:var(--ink2);}
.tip{margin:12px 0 0;font-size:14px;color:var(--amber);line-height:1.5;}
.err{margin:10px 4px;font-size:13px;color:#9a3d00;text-align:center;line-height:1.5;font-weight:500;}

.controls{margin-top:22px;}
.mic{width:100%;padding:19px;border-radius:22px;border:0;cursor:pointer;background:var(--red);
  color:#fff;font:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em;
  transition:transform .15s,background .2s,box-shadow .2s;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.mic:active{transform:scale(.98);}
.mic.hold{background:#b3231c;transform:scale(.985);
  box-shadow:0 0 0 7px rgba(229,50,42,.18),0 0 0 15px rgba(229,50,42,.08);}
.mic.next{background:rgba(255,255,255,.78);color:var(--ink);
  border:.5px solid var(--line);box-shadow:0 2px 8px rgba(16,18,28,.08);}
.mic[disabled]{opacity:.55;}
.holdhint{margin:8px 0 0;text-align:center;font-size:13px;color:var(--ink2);line-height:1.5;}

/* 원형 녹음 버튼 */
.recwrap{position:relative;width:120px;height:120px;margin:2px auto 0;}
.rechalo{position:absolute;inset:14px;border-radius:50%;background:rgba(229,50,42,.18);
  opacity:0;transform:scale(1);transition:transform .09s linear,opacity .2s;pointer-events:none;}
.recwrap.holding .rechalo{opacity:1;}
.recring{position:absolute;inset:0;width:120px;height:120px;transform:rotate(-90deg);pointer-events:none;overflow:visible;}
.rr-bg{fill:none;stroke:rgba(16,18,28,.09);stroke-width:4;opacity:0;transition:opacity .2s;}
.rr-fg{fill:none;stroke:var(--red);stroke-width:4.5;stroke-linecap:round;opacity:0;}
.recwrap.holding .rr-bg,.recwrap.busy .rr-bg{opacity:1;}
.recwrap.live .rr-fg{opacity:1;}
.recbtn{position:absolute;left:18px;top:18px;width:84px;height:84px;border-radius:50%;border:0;padding:0;
  background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;font:inherit;
  box-shadow:0 8px 22px rgba(229,50,42,.32),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .16s cubic-bezier(.4,0,.2,1),background .2s,box-shadow .2s;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.recbtn *{pointer-events:none;}
.recwrap.holding .recbtn{transform:scale(.88);background:#c42a22;box-shadow:0 4px 12px rgba(229,50,42,.3);}
.recbtn[disabled]{cursor:default;}
.micico{width:30px;height:30px;fill:#fff;stroke:#fff;display:block;}
.recbtn .hsec{font-size:19px;font-weight:700;letter-spacing:-.02em;}
.recbtn .spin{margin:0;width:22px;height:22px;border-color:rgba(255,255,255,.42);border-top-color:#fff;}
.hsec{font-variant-numeric:tabular-nums;}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;
  margin-right:9px;vertical-align:1px;animation:pl 1s ease-in-out infinite;}
@keyframes pl{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
.type-row{display:flex;gap:8px;margin-top:12px;}
.input{flex:1;padding:14px 16px;border-radius:16px;font:inherit;font-size:16px;
  background:rgba(255,255,255,.8);border:.5px solid var(--line);color:var(--ink);}
.input.full{width:100%;margin-top:10px;}
.input::placeholder{color:rgba(60,60,67,.42);}

.slider{width:100%;margin-top:16px;accent-color:var(--red);}
.ends{display:flex;justify-content:space-between;margin-top:4px;}
.legend{display:flex;gap:14px;margin-top:14px;font-size:17px;}
.toggle{margin-top:16px;width:52px;height:31px;border-radius:999px;border:0;cursor:pointer;
  background:rgba(255,255,255,.16);position:relative;transition:background .2s;}
.toggle.on{background:var(--green);}
.toggle i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  transition:transform .2s cubic-bezier(.4,0,.2,1);display:block;}
.toggle.on i{transform:translateX(21px);}

.sheetwrap{position:fixed;inset:0;z-index:6;background:rgba(16,18,28,.3);display:flex;align-items:flex-end;}
.sheet{width:100%;max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;
  padding:10px 18px calc(32px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
.grabber{width:38px;height:5px;border-radius:999px;background:rgba(16,18,28,.2);margin:0 auto 16px;}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(16,18,28,.06);margin-bottom:18px;}
.seg-b{flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;
  padding:9px;border-radius:11px;cursor:pointer;}
.seg-b.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,18,28,.14);}
.weeks{display:flex;flex-direction:column;gap:6px;}
.wk{display:flex;align-items:center;gap:12px;text-align:left;border:.5px solid var(--line);
  background:rgba(255,255,255,.6);color:var(--ink);font:inherit;font-size:15px;border-radius:14px;
  padding:11px 14px;cursor:pointer;}
.wk-n{flex:none;min-width:38px;font-size:13px;font-weight:600;color:var(--red);}
.wk-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wk-w{flex:none;font-size:12px;color:var(--ink3);}
.wk-d{flex:none;width:7px;height:7px;border-radius:50%;background:#34c759;}
.wk.on{background:var(--red);border-color:transparent;color:#fff;font-weight:600;}
.wk.on .wk-n,.wk.on .wk-w{color:rgba(255,255,255,.85);}
.ep{margin:0 0 14px;}
.ep-n{font-size:13px;font-weight:600;color:var(--red);margin:0 0 4px;}
.ep-t{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px;}
.ep-s{font-size:14.5px;line-height:1.5;color:var(--ink2);margin:0;}
.spk{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;margin-right:6px;
  border-radius:999px;background:rgba(229,50,42,.1);color:var(--red);vertical-align:1px;}

.spin{display:inline-block;width:15px;height:15px;border-radius:50%;vertical-align:-2px;
  border:2px solid rgba(16,18,28,.18);border-top-color:var(--ink);animation:sp .7s linear infinite;margin-right:7px;}
.mic .spin{border-color:rgba(255,255,255,.42);border-top-color:#fff;}
@keyframes sp{to{transform:rotate(360deg);}}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div id="app"><div class="screen"><div class="glass card"><p class="sub"><span class="spin"></span>불러오는 중</p></div></div></div>

<script src="./speech-sdk.js"></script>
<script>
"use strict";

/* ===================== 저장 ===================== */
var PK = "ct:v4";
var saved = (function () {
  try { return JSON.parse(localStorage.getItem(PK)) || {}; } catch (e) { return {}; }
})();
var P = {
  azKey: saved.azKey || "",
  azRegion: saved.azRegion || "koreacentral",
  gmKey: saved.gmKey || "",
  gmModel: saved.gmModel || "gemini-3.6-flash",
  words: saved.words || {},
  missed: saved.missed || {},
  log: saved.log || [],
  gen: saved.gen || {},
  tint: typeof saved.tint === "number" ? saved.tint : 42,
  tone: saved.tone !== false
};
function persist() {
  try { localStorage.setItem(PK, JSON.stringify(P)); return true; }
  catch (e) {
    try { P.gen = {}; localStorage.setItem(PK, JSON.stringify(P)); return true; }
    catch (e2) { return false; }
  }
}

var BUILD = "2026-09-21 b5";
var CURRICULUM = null;
var S = { tab: "home", ph: 0, wk: 0, sheet: false, toast: "", sess: null, busy: "" };

/* ===================== 유틸 ===================== */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
var TONES = ["āēīōūǖĀĒĪŌŪǕ", "áéíóúǘÁÉÍÓÚǗ", "ǎěǐǒǔǚǍĚǏǑǓǙ", "àèìòùǜÀÈÌÒÙǛ"];
function toneOf(syl) {
  for (var t = 0; t < 4; t++) for (var i = 0; i < syl.length; i++)
    if (TONES[t].indexOf(syl[i]) > -1) return t + 1;
  return 5;
}
var TONE_KO = { 1: "1성", 2: "2성", 3: "3성", 4: "4성", 5: "경성" };
function pinyinHTML(text, cls) {
  if (!text) return "";
  var body = P.tone
    ? String(text).split(/(\s+)/).map(function (c) {
        return /^\s+$/.test(c) ? c : '<span class="t' + toneOf(c) + '">' + esc(c) + "</span>";
      }).join("")
    : esc(text);
  return '<p class="pinyin ' + (cls || "") + '">' + body + "</p>";
}
function ringHTML(v) {
  var s = 76, r = (s - 9) / 2, c = 2 * Math.PI * r;
  return '<svg class="ring" width="' + s + '" height="' + s + '">'
    + '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" class="ring-bg" stroke-width="7" fill="none"/>'
    + '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" class="ring-fg" stroke-width="7" fill="none"'
    + ' stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c * (1 - v) + '"/></svg>';
}
function hanziChars(s) { return String(s || "").replace(/[^一-鿿]/g, "").split(""); }
function toast(m) { S.toast = m; render(); setTimeout(function () { S.toast = ""; render(); }, 5000); }

/* ===================== TTS ===================== */
function speak(text, rate) {
  if (!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = rate || 0.85;
  var vs = window.speechSynthesis.getVoices();
  for (var i = 0; i < vs.length; i++)
    if ((vs[i].lang || "").toLowerCase().indexOf("zh") === 0) { u.voice = vs[i]; break; }
  window.speechSynthesis.speak(u);
}

/* ===================== Azure 음성 ===================== */
var SDK = window.SpeechSDK;
var micErr = "";

function azureReady() { return !!(SDK && P.azKey && P.azRegion); }

function makePush() {
  return SDK.AudioInputStream.createPushStream(SDK.AudioStreamFormat.getWaveFormatPCM(16000, 16, 1));
}

function makeRecognizer(referenceText, push) {
  var cfg = SDK.SpeechConfig.fromSubscription(P.azKey, P.azRegion);
  cfg.speechRecognitionLanguage = "zh-CN";
  /* 초급자는 문장 중간에 쉬는 일이 많다 — 1.5초까지는 한 문장으로 본다 */
  try { cfg.setProperty(SDK.PropertyId.Speech_SegmentationSilenceTimeoutMs, "1500"); } catch (e) {}
  var rec = new SDK.SpeechRecognizer(cfg, SDK.AudioConfig.fromStreamInput(push));
  if (referenceText) {
    var pa = new SDK.PronunciationAssessmentConfig(
      referenceText,
      SDK.PronunciationAssessmentGradingSystem.HundredMark,
      SDK.PronunciationAssessmentGranularity.Phoneme,
      false
    );
    try { pa.enableProsodyAssessment = true; } catch (e) {}
    pa.applyTo(rec);
  }
  return rec;
}

/* --- 누르고 있는 동안만 녹음 ---
   마이크를 직접 열어 16kHz PCM 으로 바꾼 뒤 Azure 푸시 스트림에 흘려 넣는다.
   · 앞: 녹음 맨 앞에 0.5초 여백을 붙이고, 마이크가 실제로 소리를 받기 시작한
         순간부터 링을 그린다 — 링이 돌기 시작하면 말하면 된다
   · 뒤: 손을 뗀 뒤에도 0.5초 더 받아서 끝음절이 잘리지 않게 한다 */
var HOLD = null;
var micState = "idle";            /* idle | hold | busy */
var holdT0 = 0;                   /* 누른 시각 */
var MIN_HOLD = 400;               /* 이보다 짧게 누르면 무시 */
var LEAD_MS = 500, TAIL_MS = 500;
var MAX_MS = 10000;               /* 링 한 바퀴 = 10초. 넘기면 뗀 것으로 처리 */
var RING_R = 52, RING_C = 2 * Math.PI * RING_R;
var ringRAF = null, ringFrac = 0;
var AC = null;

function audioCtx() {
  if (!AC) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
  }
  if (AC.state !== "running") { try { AC.resume(); } catch (e) {} }
  return AC;
}

/* 입력 샘플레이트 → 16kHz. 구간 평균으로 줄여서 앨리어싱을 누른다 */
function Downsampler(inRate) { this.r = inRate / 16000; this.rest = new Float32Array(0); this.pos = 0; }
Downsampler.prototype.push = function (x) {
  var src = x;
  if (this.rest.length) {
    src = new Float32Array(this.rest.length + x.length);
    src.set(this.rest, 0); src.set(x, this.rest.length);
  }
  var out = [], pos = this.pos, r = this.r;
  while (pos + r <= src.length) {
    var a = Math.floor(pos), b = Math.max(a + 1, Math.floor(pos + r)), sum = 0;
    for (var i = a; i < b; i++) sum += src[i];
    out.push(sum / (b - a));
    pos += r;
  }
  var keepFrom = Math.floor(pos);
  this.rest = src.slice(keepFrom);
  this.pos = pos - keepFrom;
  var pcm = new Int16Array(out.length);
  for (var k = 0; k < out.length; k++) {
    var v = Math.max(-1, Math.min(1, out[k]));
    pcm[k] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  return pcm;
};

function parseResult(result, referenceText) {
  var out = { text: result.text || "", pa: null };
  if (referenceText) {
    try {
      var pr = SDK.PronunciationAssessmentResult.fromResult(result);
      var raw = null;
      try {
        raw = JSON.parse(result.properties.getProperty(
          SDK.PropertyId.SpeechServiceResponse_JsonResult));
      } catch (e) {}
      out.pa = {
        accuracy: Math.round(pr.accuracyScore || 0),
        fluency: Math.round(pr.fluencyScore || 0),
        completeness: Math.round(pr.completenessScore || 0),
        pron: Math.round(pr.pronunciationScore || 0),
        prosody: (pr.prosodyScore != null && !isNaN(pr.prosodyScore)) ? Math.round(pr.prosodyScore) : null,
        syllables: extractSyllables(raw)
      };
    } catch (e) { /* 채점만 실패 — 전사는 살린다 */ }
  }
  return out;
}

function azErr(d) {
  if (/401|403|Forbidden|Unauthorized|subscription/i.test(d)) return "Azure 키 또는 지역이 올바르지 않습니다.";
  if (/permission|NotAllowed|denied|NotFound/i.test(d)) return "마이크 권한이 거부되었습니다. 사파리 설정에서 마이크를 허용하세요.";
  if (/1006|connection|websocket|network/i.test(d)) return "Azure에 연결하지 못했습니다. 키와 지역을 확인하세요.";
  return d ? "Azure 오류 · " + String(d).slice(0, 140) : "인식이 중단되었습니다.";
}

function holdBegin(referenceText) {
  return new Promise(function (resolve, reject) {
    if (!SDK) return reject({ msg: "음성 라이브러리를 불러오지 못했습니다. 새로고침 해보세요." });
    if (!P.azKey || !P.azRegion) return reject({ msg: "설정에서 Azure 키와 지역을 넣어주세요." });
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      return reject({ msg: "이 브라우저에서는 마이크를 쓸 수 없습니다. 주소가 https 인지 확인하세요." });

    var st = { got: [], settled: false, live: false, t0: 0, level: 0, released: false,
               closed: false, bytes: 0, resolve: resolve, reject: reject };
    HOLD = st;

    try {
      st.push = makePush();
      st.rec = makeRecognizer(referenceText, st.push);
    } catch (e) {
      HOLD = null;
      return reject({ msg: "음성 인식을 시작하지 못했습니다." });
    }

    st.write = function (pcm) {
      if (st.closed || !pcm.length) return;
      try { st.push.write(pcm.buffer); st.bytes += pcm.byteLength; } catch (e) {}
    };
    /* 앞 여백 0.5초 */
    st.write(new Int16Array(Math.round(16000 * LEAD_MS / 1000)));

    st.teardown = function () {
      try { if (st.proc) { st.proc.onaudioprocess = null; st.proc.disconnect(); } } catch (e) {}
      try { if (st.src) st.src.disconnect(); } catch (e) {}
      try { if (st.mute) st.mute.disconnect(); } catch (e) {}
      try { if (st.stream) st.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      st.proc = st.src = st.mute = st.stream = null;
    };
    st.closeInput = function () {
      if (st.closed) return;
      st.teardown();
      st.closed = true;
      try { st.push.close(); } catch (e) {}
    };
    st.settle = function (fn, arg) {
      if (st.settled) return;
      st.settled = true;
      clearTimeout(st.tailTimer); clearTimeout(st.waitTimer);
      st.teardown();
      if (!st.closed) { st.closed = true; try { st.push.close(); } catch (e) {} }
      try { st.rec.close(); } catch (e) {}
      if (HOLD === st) HOLD = null;
      fn(arg);
    };

    st.rec.recognized = function (_s, e) {
      try {
        if (e.result && e.result.reason === SDK.ResultReason.RecognizedSpeech && e.result.text)
          st.got.push(parseResult(e.result, referenceText));
      } catch (x) {}
    };
    st.rec.canceled = function (_s, e) {
      /* 입력 스트림을 닫으면 EndOfStream 으로 끝난다 — 정상 종료 */
      if (e && e.reason === SDK.CancellationReason.EndOfStream) return holdFinish(st);
      var d = ""; try { d = e.errorDetails || ""; } catch (x) {}
      st.settle(st.reject, { msg: azErr(d) });
    };
    st.rec.sessionStopped = function () { holdFinish(st); };
    st.rec.startContinuousRecognitionAsync(function () {}, function (err) {
      st.settle(st.reject, { msg: azErr(String(err || "")) });
    });

    navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).then(function (stream) {
      if (st.settled || st.closed) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      var ac = audioCtx();
      if (!ac) return st.settle(st.reject, { msg: "이 브라우저는 오디오 처리를 지원하지 않습니다." });
      st.stream = stream;
      st.src = ac.createMediaStreamSource(stream);
      st.proc = ac.createScriptProcessor(2048, 1, 1);
      st.mute = ac.createGain(); st.mute.gain.value = 0;
      var ds = new Downsampler(ac.sampleRate);
      st.proc.onaudioprocess = function (ev) {
        if (st.closed) return;
        var x = ev.inputBuffer.getChannelData(0);
        var sum = 0, peak = 0;
        for (var i = 0; i < x.length; i++) {
          var v = x[i]; sum += v * v;
          if (v > peak) peak = v; else if (-v > peak) peak = -v;
        }
        if (!st.live) {
          /* 하드웨어가 아직 완전한 0 만 보내면 켜진 게 아니다 */
          if (peak < 1e-7) return;
          st.live = true; st.t0 = Date.now();
        }
        st.level = st.level * 0.6 + Math.sqrt(sum / x.length) * 0.4;
        st.write(ds.push(x));
      };
      st.src.connect(st.proc); st.proc.connect(st.mute); st.mute.connect(ac.destination);
    }).catch(function (e) {
      var n = e && e.name;
      st.settle(st.reject, { msg: (n === "NotAllowedError" || n === "SecurityError")
        ? "마이크 권한이 거부되었습니다. 사파리 설정에서 마이크를 허용하세요."
        : "마이크를 열지 못했습니다." });
    });
  });
}

function holdFinish(st) {
  if (!st || st.settled || !st.closed) return;
  if (!st.got.length)
    return st.settle(st.reject, { msg: "소리를 알아듣지 못했습니다. 링이 돌기 시작하면 또박또박 말해보세요." });
  var text = st.got.map(function (x) { return x.text; }).join("");
  var best = null;
  st.got.forEach(function (g) {
    if (g.pa && (!best || (g.pa.syllables || []).length > (best.syllables || []).length)) best = g.pa;
  });
  st.settle(st.resolve, { text: text, pa: best });
}

function holdEnd() {
  var st = HOLD;
  if (!st || st.settled || st.released) return;
  st.released = true;
  /* 손을 뗀 뒤 0.5초 더 받는다 */
  st.tailTimer = setTimeout(function () {
    st.closeInput();
    st.waitTimer = setTimeout(function () {
      if (st.got.length) holdFinish(st);
      else st.settle(st.reject, { msg: "Azure 응답이 늦습니다. 네트워크를 확인하고 다시 시도하세요." });
    }, 9000);
  }, TAIL_MS);
}

function holdAbort(msg) {
  var st = HOLD;
  if (!st || st.settled) return;
  st.settle(st.reject, { msg: msg || "" });
}

/* 링 — 마이크가 살아난 순간부터 10초에 한 바퀴. 바깥 후광은 목소리 크기를 따라간다 */
function ringLoop() {
  var st = HOLD;
  if (micState !== "hold" || !st) { ringRAF = null; return; }
  if (st.live) {
    var el = Date.now() - st.t0;
    ringFrac = Math.min(1, el / MAX_MS);
    var wrap = document.getElementById("recwrap");
    if (wrap && wrap.className.indexOf(" live") < 0) wrap.className += " live";
    var ring = document.getElementById("recring");
    if (ring) ring.style.strokeDashoffset = String(RING_C * (1 - ringFrac));
    var sec = document.getElementById("hsec");
    if (sec) sec.textContent = (el / 1000).toFixed(1);
    var halo = document.getElementById("rechalo");
    if (halo) halo.style.transform = "scale(" + (1 + Math.min(0.28, st.level * 3)).toFixed(3) + ")";
    if (el >= MAX_MS) { ringRAF = null; micRelease(); return; }
  }
  ringRAF = requestAnimationFrame(ringLoop);
}
function startRing() { stopRing(); ringRAF = requestAnimationFrame(ringLoop); }
function stopRing() { if (ringRAF) cancelAnimationFrame(ringRAF); ringRAF = null; }

function extractSyllables(raw) {
  try {
    var best = raw && raw.NBest && raw.NBest[0];
    if (!best || !best.Words) return [];
    var out = [];
    best.Words.forEach(function (w) {
      var wScore = (w.PronunciationAssessment || {}).AccuracyScore;
      var syls = w.Syllables || [];
      if (!syls.length) {
        out.push({ label: w.Word || "", score: wScore == null ? null : Math.round(wScore) });
        return;
      }
      syls.forEach(function (s) {
        var sc = (s.PronunciationAssessment || {}).AccuracyScore;
        out.push({
          label: s.Syllable || "",
          score: sc == null ? (wScore == null ? null : Math.round(wScore)) : Math.round(sc)
        });
      });
    });
    return out;
  } catch (e) { return []; }
}

/* ===================== Gemini ===================== */
var GM = "https://generativelanguage.googleapis.com/v1beta/models";

function asArray(res) {
  if (Array.isArray(res)) return res;
  if (res && typeof res === "object")
    for (var k in res) if (Array.isArray(res[k])) return res[k];
  return [];
}

var EX_SCHEMA = {
  type: "ARRAY",
  items: {
    type: "OBJECT",
    properties: {
      hanzi: { type: "STRING" }, zh: { type: "STRING" },
      pinyin: { type: "STRING" }, ko: { type: "STRING" }
    },
    required: ["hanzi", "zh", "pinyin", "ko"]
  }
};

async function gemini(prompt, schema) {
  if (!P.gmKey) throw { msg: "설정에서 Gemini 키를 넣어주세요." };
  var cfg = { responseMimeType: "application/json" };
  if (schema) cfg.responseSchema = schema;
  var res = await fetch(GM + "/" + P.gmModel + ":generateContent?key=" + encodeURIComponent(P.gmKey), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ role: "user", parts: [{ text: prompt }] }],
      generationConfig: cfg
    })
  });
  if (!res.ok) {
    var body = await res.text();
    if (res.status === 400 && body.indexOf("API_KEY") > -1) throw { msg: "Gemini 키가 올바르지 않습니다." };
    if (res.status === 429) throw { msg: "Gemini 호출 한도를 넘었습니다. 잠시 뒤 다시 시도하세요." };
    if (res.status === 404) throw { msg: "모델 이름을 확인하세요 — " + P.gmModel };
    throw { msg: "Gemini 오류 " + res.status };
  }
  var data = await res.json();
  var parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];
  var text = parts.map(function (p) { return p.text || ""; }).join("").replace(/```json|```/g, "").trim();
  if (!text) throw { msg: "Gemini가 빈 응답을 보냈습니다. 다시 시도하세요." };
  try { return JSON.parse(text); }
  catch (e) { throw { msg: "Gemini 응답을 읽지 못했습니다. 다시 시도하세요." }; }
}

/* ===================== 커리큘럼 ===================== */
function phase() { return CURRICULUM.phases[S.ph]; }
function week() { return phase().weeks[S.wk]; }
function epNo(ph, w) { return ph === 0 ? w.week : CURRICULUM.phases[0].weeks.length + w.week; }
function koHTML(ko) {
  var m = /^\[([^\]]+)\]\s*(.*)$/.exec(ko || "");
  return m ? '<span class="spk">' + esc(m[1]) + "</span>" + esc(m[2]) : esc(ko || "");
}
function wkey(si, h) { return S.ph + ":" + week().week + ":" + si + ":" + h; }

function sessionVocab(si) {
  return week().sessions[si].target_vocab.map(function (v) {
    return { hanzi: v.hanzi, pinyin: v.pinyin, en: v.en || "", ex: v.example || null };
  });
}

async function ensureSentences(si) {
  var vs = sessionVocab(si);
  var todo = vs.filter(function (v) { return !P.words[wkey(si, v.hanzi)]; });
  var pool = (todo.length ? todo : vs).slice(0, 5);
  var ck = S.ph + ":" + week().week + ":" + si;
  var cache = P.gen[ck] || {};

  var need = pool.filter(function (v) { return !v.ex && !cache[v.hanzi]; });
  if (need.length) {
    var listing = need.map(function (v) {
      return "- " + v.hanzi + " (" + v.pinyin + ") " + v.en;
    }).join("\n");
    var res = await gemini(
      "한국인 중국어 초급 학습자를 위한 예문을 만듭니다. 아래 각 단어마다 예문 한 개씩.\n\n" + listing
      + "\n\n규칙\n- 길이 4~10자. 초급자가 한 호흡에 말할 수 있어야 합니다.\n"
      + "- 해당 단어 외에는 HSK 3급 이하 어휘만.\n"
      + "- 교과서 예문이 아니라 실제 대화에서 쓰는 문장으로. 식당, 회사, 약속, 쇼핑, 전화 상황 중심.\n"
      + "- zh 에 문장부호를 넣지 말 것. pinyin 은 성조부호 포함, 단어 단위 띄어쓰기.\n"
      + "- ko 는 한국어로 자연스러운 구어체.\n\n"
      + "- hanzi 에는 위에 제시된 단어를 그대로 적을 것. 순서도 위 목록과 같게.\n\n"
      + 'JSON 배열만 출력하세요. 예: [{"hanzi":"的","zh":"这是我的手机","pinyin":"zhè shì wǒ de shǒujī","ko":"이건 제 휴대폰이에요"}]',
      EX_SCHEMA
    );
    var rows = asArray(res);
    rows.forEach(function (r, i) {
      if (!r || !r.zh) return;
      /* 모델이 hanzi 를 그대로 되돌려주지 않는 경우가 있어 순서로도 맞춘다 */
      var key = null;
      if (r.hanzi) for (var k = 0; k < need.length; k++)
        if (need[k].hanzi === r.hanzi) { key = r.hanzi; break; }
      if (!key && need[i]) key = need[i].hanzi;
      if (key) cache[key] = { zh: r.zh, pinyin: r.pinyin || "", ko: r.ko || "" };
    });
    P.gen[ck] = cache; persist();
  }

  var out = [];
  pool.forEach(function (v) {
    var e = v.ex || cache[v.hanzi];
    if (e && e.zh) out.push({
      word: v.hanzi, wordPinyin: v.pinyin, wordKo: v.en,
      zh: e.zh, pinyin: e.pinyin, ko: e.ko,
      tag: wkey(si, v.hanzi), key: wkey(si, v.hanzi)
    });
  });
  if (!out.length) throw { msg: "예문을 만들지 못했습니다. 설정에서 Gemini 키와 모델 이름을 확인하세요." };
  return out;
}

/* ===================== 회차 ===================== */
async function startSession(si) {
  S.busy = "예문을 준비하는 중"; render();
  var fresh;
  try { fresh = await ensureSentences(si); }
  catch (e) { S.busy = ""; return toast(e.msg || "예문을 만들지 못했습니다."); }
  if (!fresh.length) { S.busy = ""; return toast("예문을 만들지 못했습니다."); }

  var carry = P.log.slice(-20).sort(function () { return Math.random() - 0.5; }).slice(0, 2);
  S.sess = {
    si: si, fresh: fresh, items: carry.concat(fresh), idx: 0,
    part: "warmup", said: "", pa: null, result: null, stage: "ask",
    turn: 0, history: [], cur: null, last: null, reveal: false, err: ""
  };
  S.busy = ""; micErr = ""; render();
  setTimeout(function () { speak(S.sess.items[0].zh); }, 400);
}

function finishSession() {
  var s = S.sess;
  if (s) s.fresh.forEach(function (f) { P.words[f.key] = true; logSentence(f); });
  persist();
  S.sess = null; S.tab = "home"; render();
}

function logSentence(it) {
  if (!P.log.some(function (l) { return l.zh === it.zh; }))
    P.log.push({ zh: it.zh, pinyin: it.pinyin, ko: it.ko, tag: it.tag });
  P.log = P.log.slice(-60);
}

function applyWarmup(r) {
  var s = S.sess, it = s.items[s.idx];
  s.said = r.text; s.pa = r.pa;
  var sc = r.pa ? r.pa.pron : null;
  s.result = sc == null ? "close" : sc >= 80 ? "pass" : sc >= 60 ? "close" : "fail";
  if (s.result === "pass") {
    delete P.missed[it.tag];
    /* 문장 하나를 통과할 때마다 바로 저장한다 — 중간에 나가도 남는다 */
    if (it.key) P.words[it.key] = true;
    logSentence(it);
  } else {
    P.missed[it.tag] = { zh: it.zh, pinyin: it.pinyin, ko: it.ko, tag: it.tag };
  }
  persist(); render();
}

async function micPress(mode) {
  if (micState !== "idle" || !S.sess) return;
  /* 문장 읽어주는 소리가 녹음에 섞이지 않게 끊는다 */
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  audioCtx();
  var ref = mode === "warmup" ? S.sess.items[S.sess.idx].zh : null;
  micState = "hold"; micErr = ""; holdT0 = Date.now(); ringFrac = 0;
  render(); startRing();
  try {
    var r = await holdBegin(ref);
    stopRing(); micState = "idle"; ringFrac = 0;
    if (mode === "warmup") applyWarmup(r);
    else if (!r.text) { micErr = "아무 말도 인식되지 않았습니다."; render(); }
    else { S.sess.turn++; talkStep(r.text); }
  } catch (e) {
    stopRing(); micState = "idle"; ringFrac = 0;
    micErr = (e && e.msg) || "인식에 실패했습니다.";
    render();
  }
}

function micRelease() {
  if (micState !== "hold") return;
  stopRing();
  if (Date.now() - holdT0 < MIN_HOLD) {
    holdAbort("조금 더 길게 누른 채로 말해주세요.");
    return;
  }
  micState = "busy"; render();
  holdEnd();
}

function gradeTyped(text) {
  var s = S.sess, it = s.items[s.idx];
  var a = text.replace(/[\s，。？！、,.?!]/g, "");
  var b = it.zh.replace(/[\s，。？！、,.?!]/g, "");
  s.said = text; s.pa = null;
  s.result = a === b ? "pass" : "fail";
  if (s.result === "pass") delete P.missed[it.tag];
  else P.missed[it.tag] = { zh: it.zh, pinyin: it.pinyin, ko: it.ko, tag: it.tag };
  persist(); render();
}

function nextWarmup() {
  var s = S.sess;
  if (s.idx + 1 < s.items.length) {
    s.idx++; s.said = ""; s.pa = null; s.result = null; micErr = ""; render();
    setTimeout(function () { speak(s.items[s.idx].zh); }, 350);
  } else if (P.gmKey) {
    s.part = "talk"; s.stage = "load"; render(); talkStep(null);
  } else finishSession();
}

/* ---- 2부 ---- */
function talkPrompt(userSaid) {
  var s = S.sess;
  var vocab = s.fresh.map(function (f) { return f.word + "(" + f.wordPinyin + ")"; }).join(", ");
  var sents = s.fresh.map(function (f) { return f.zh + " — " + f.ko; }).join("\n");
  var convo = s.history.length
    ? s.history.map(function (h) { return (h.r === "t" ? "튜터: " : "학습자: ") + h.zh; }).join("\n")
    : "(아직 없음)";
  var ep = week().episode;
  var story = ep ? "배경 이야기: 학습자는 베이징의 중학교에 파견된 20대 한국인 정보 선생님(金老师)입니다."
      + " 이번 화 「" + ep.title + "」 — " + ep.summary + "\n"
      + "대화는 이 이야기 속 상황(학교, 동료, 학생, 집주인, 고양이 등)에서 자연스럽게 이어가세요. 튜터는 동료 선생님처럼 말합니다.\n"
    : "";
  var p = "당신은 한국인 초급 중국어 학습자와 전화로 짧게 대화하는 중국어 튜터입니다.\n\n"
    + story
    + "학습자는 아주 짧은 문장만 말할 수 있습니다. 한 번에 한 가지만 물으세요.\n"
    + "이번 회차 목표 어휘: " + vocab + "\n방금 연습한 문장:\n" + sents + "\n\n"
    + "지금까지의 대화:\n" + convo + "\n\n";
  if (userSaid) {
    p += "학습자의 방금 답(음성인식 결과): " + userSaid + "\n\n"
      + "먼저 이 답을 평가하세요.\n"
      + "- verdict: 의미가 통하면 good, 통하지만 어색하면 partial, 질문과 무관하거나 알아들을 수 없으면 off.\n"
      + "- 문법이 완벽하지 않아도 의미가 통하면 good 으로 봅니다. 너그럽게 보세요.\n"
      + "- tip: partial 이나 off 일 때만 한국어 한 줄, 30자 이내. 어순 문제면 그것부터. good 이면 빈 문자열.\n"
      + "- reply/replyPinyin/replyKo: 학습자 답에 대한 자연스러운 맞장구 한 문장, 6~10자.\n\n";
  } else {
    p += "대화를 여는 첫 질문을 만드세요. verdict, tip, reply, replyPinyin, replyKo 는 모두 빈 문자열로 두세요.\n\n";
  }
  p += "그다음 질문을 하나 만드세요.\n"
    + "- question/questionPinyin/questionKo: 6~12자의 짧은 질문. 목표 어휘와 위 문장의 표현 범위 안에서.\n"
    + "- hint: 어떤 내용으로 답하면 되는지 한국어 안내. 예: \"어디에 가는지 장소를 말해보세요\". 정답을 그대로 주지 말 것.\n"
    + "- example/examplePinyin/exampleKo: 모범 답 하나. 학습자가 막혔을 때 보여줄 용도.\n\n"
    + "중국어에 문장부호를 넣지 마세요. 아래 키를 모두 가진 JSON 객체 하나만 출력하세요.\n"
    + '{"verdict":"","tip":"","reply":"","replyPinyin":"","replyKo":"","question":"","questionPinyin":"","questionKo":"","hint":"","example":"","examplePinyin":"","exampleKo":""}';
  return p;
}

async function talkStep(userSaid) {
  var s = S.sess;
  s.stage = "load"; s.err = ""; render();
  try {
    var r = await gemini(talkPrompt(userSaid));
    if (userSaid) s.history.push({ r: "u", zh: userSaid });
    if (r.reply) s.history.push({ r: "t", zh: r.reply });
    s.history.push({ r: "t", zh: r.question });
    s.last = userSaid ? r : null; s.cur = r; s.reveal = false; s.said = userSaid || "";
    s.stage = userSaid ? "result" : "ask"; render();
    if (!userSaid) setTimeout(function () { speak(r.question); }, 350);
  } catch (e) {
    s.err = e.msg || "연결에 문제가 있습니다.";
    s.stage = s.cur ? "ask" : "err"; render();
  }
}

function proceedTalk() {
  var s = S.sess;
  if (s.turn >= 8) return finishSession();
  s.stage = "ask"; s.last = null; micErr = ""; render();
  setTimeout(function () { speak(s.cur.question); }, 200);
}

var MIC_ICON = '<svg class="micico" viewBox="0 0 24 24" aria-hidden="true">'
  + '<rect x="9" y="2.5" width="6" height="11.5" rx="3"/>'
  + '<path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke-width="1.9" stroke-linecap="round"/></svg>';

function micBlock(label, mode) {
  var hold = micState === "hold", busy = micState === "busy";
  var inner, hint;
  if (hold) {
    /* 마이크가 살아나면 링이 이 자리를 초 단위 숫자로 바꾼다 */
    inner = '<span id="hsec" class="hsec">' + MIC_ICON + "</span>";
    hint = "손을 떼면 " + (mode === "warmup" ? "채점합니다" : "보냅니다");
  } else if (busy) {
    inner = '<span class="spin"></span>';
    hint = mode === "warmup" ? "채점 중" : "알아듣는 중";
  } else {
    inner = MIC_ICON;
    hint = label;
  }
  var cls = "recwrap" + (hold ? " holding" : "") + (busy ? " busy" : "") + (busy && ringFrac > 0 ? " live" : "");
  var off = RING_C * (1 - (busy ? ringFrac : 0));
  var h = '<div class="controls">'
    + '<div class="' + cls + '" id="recwrap">'
    + '<span class="rechalo" id="rechalo"></span>'
    + '<svg class="recring" viewBox="0 0 120 120" aria-hidden="true">'
    + '<circle class="rr-bg" cx="60" cy="60" r="' + RING_R + '"/>'
    + '<circle class="rr-fg" id="recring" cx="60" cy="60" r="' + RING_R + '"'
    + ' stroke-dasharray="' + RING_C.toFixed(2) + '" style="stroke-dashoffset:' + off.toFixed(2) + '"/>'
    + "</svg>"
    + '<button class="recbtn" data-hold="' + mode + '" aria-label="' + esc(label) + '"'
    + (busy ? " disabled" : "") + ">" + inner + "</button>"
    + "</div>"
    + '<p class="holdhint">' + esc(hint) + "</p>";
  if (micErr) h += '<p class="err">' + esc(micErr) + "</p>";
  h += '<div class="type-row"><input class="input" id="typed" placeholder="직접 입력" aria-label="답 입력">'
    + '<button class="pill solid" data-a="typed">확인</button></div></div>';
  return h;
}

function scoreCls(n) { return n == null ? "" : n >= 80 ? "good" : n >= 60 ? "mid" : "bad"; }

function paHTML(it, pa) {
  if (!pa) return "";
  var h = '<div class="scores">'
    + '<div class="sc"><b>' + pa.pron + "</b><span>종합</span></div>"
    + '<div class="sc"><b>' + pa.accuracy + "</b><span>정확도</span></div>"
    + '<div class="sc"><b>' + pa.fluency + "</b><span>유창성</span></div>"
    + (pa.prosody != null ? '<div class="sc"><b>' + pa.prosody + "</b><span>억양</span></div>" : "")
    + "</div>";

  var chars = hanziChars(it.zh);
  var syl = pa.syllables || [];
  if (syl.length) {
    var aligned = syl.length === chars.length;
    h += '<div class="sylrow">';
    syl.forEach(function (s, i) {
      var label = aligned ? chars[i] : (s.label || "?");
      h += '<div class="syl ' + scoreCls(s.score) + '"><span class="h">' + esc(label) + "</span>"
        + '<span class="p">' + (s.score == null ? "—" : s.score) + "</span></div>";
    });
    h += "</div>";

    var pin = String(it.pinyin || "").split(/\s+/);
    var weak = [];
    syl.forEach(function (s, i) {
      if (s.score != null && s.score < 70) {
        var ch = aligned ? chars[i] : (s.label || "");
        var tone = (aligned && pin.length === chars.length) ? TONE_KO[toneOf(pin[i])] : null;
        weak.push(ch + (tone ? "(" + tone + ")" : ""));
      }
    });
    if (weak.length)
      h += '<p class="weak">약한 음절 · ' + esc(weak.join(", "))
        + " — 이 부분만 다시 듣고 따라 해보세요.</p>";
  }
  return h;
}

    + '<span class="t3">mǎ</span><span class="t4">mà</span><span class="t5">ma</span></div>'
    + '<button class="toggle ' + (P.tone ? "on" : "") + '" data-a="tone"><i></i></button></div>'

    + '<div class="glass card"><p class="action-t">유리 농도</p>'
    + '<input class="slider" type="range" min="0" max="100" value="' + P.tint + '" id="tint">'
    + '<div class="ends"><span class="sub">맑게</span><span class="sub">짙게</span></div></div>'

    + '<div class="glass card"><p class="action-t">데이터</p>'
    + '<p class="sub">진도, 복습 목록, 생성된 예문을 지웁니다. 키는 남습니다.</p>'
    + '<button class="pill danger" data-a="reset">초기화</button>'
    + '<p class="foot">버전 ' + BUILD + '</p></div></div>';
}

function sheetHTML() {
  var h = '<div class="sheetwrap" data-a="closesheet"><div class="sheet glass" data-stop="1">'
    + '<div class="grabber"></div><div class="seg">';
  CURRICULUM.phases.forEach(function (p, i) {
    h += '<button class="seg-b ' + (i === S.ph ? "on" : "") + '" data-a="ph" data-i="' + i + '">'
      + (i === 0 ? "1–3급 활성화" : "4급") + "</button>";
  });
  h += '</div><div class="weeks">';
  phase().weeks.forEach(function (w, i) {
    var tot = 0, dn = 0;
    w.sessions.forEach(function (sess, si) {
      sess.target_vocab.forEach(function (v) {
        tot++; if (P.words[S.ph + ":" + w.week + ":" + si + ":" + v.hanzi]) dn++; });
    });
    h += '<button class="wk ' + (i === S.wk ? "on" : "") + '" data-a="wk" data-i="' + i + '">'
      + '<span class="wk-n">' + epNo(S.ph, w) + "화</span>"
      + '<span class="wk-t">' + esc(w.episode ? w.episode.title : w.week + "주차") + "</span>"
      + (tot && dn === tot ? '<span class="wk-d"></span>' : '<span class="wk-w">' + w.week + "주</span>")
      + "</button>";
  });
  return h + "</div></div></div>";
}

function render() {
  document.documentElement.style.setProperty("--glass", 0.40 + (P.tint / 100) * 0.45);
  document.documentElement.style.setProperty("--edge", 0.55 + (P.tint / 100) * 0.35);
  var h;
  if (S.busy) {
    h = '<div class="screen"><div class="glass card center"><p class="action-t">'
      + '<span class="spin"></span>' + esc(S.busy) + "</p>"
      + '<p class="sub">이 회차에서 한 번만 만들고 저장합니다.</p></div></div>';
  } else if (S.sess) {
    h = S.sess.part === "warmup" ? warmupHTML() : talkHTML();
  } else {
    h = S.tab === "home" ? homeHTML() : S.tab === "review" ? reviewHTML() : settingsHTML();
    if (S.toast) h += '<p class="err">' + esc(S.toast) + "</p>";
    if (S.sheet) h += sheetHTML();
    h += '<nav class="tabbar glass">'
      + [["home", "홈"], ["review", "복습"], ["settings", "설정"]].map(function (t) {
          return '<button class="tab ' + (S.tab === t[0] ? "sel" : "") + '" data-a="tab" data-tab="' + t[0] + '">'
            + t[1] + "</button>"; }).join("") + "</nav>";
  }
  document.getElementById("app").innerHTML = h;
  if (S.sheet && !S.sess) {
    var on = document.querySelector(".wk.on");
    if (on) on.scrollIntoView({ block: "center" });
  }
}

/* ===================== 이벤트 ===================== */
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-a]");
  if (!t) return;
  var a = t.getAttribute("data-a");

  if (a === "say") return speak(t.getAttribute("data-t"));
  if (a === "slow") return speak(t.getAttribute("data-t"), 0.55);
  if (a === "tab") { S.tab = t.getAttribute("data-tab"); return render(); }
  if (a === "sheet") { S.sheet = true; return render(); }
  if (a === "closesheet") { if (!ev.target.closest("[data-stop]")) { S.sheet = false; render(); } return; }
  if (a === "ph") { S.ph = +t.getAttribute("data-i"); S.wk = 0; return render(); }
  if (a === "wk") { S.wk = +t.getAttribute("data-i"); S.sheet = false; return render(); }
  if (a === "start") return startSession(+t.getAttribute("data-si"));
  if (a === "exit") {
    holdAbort(""); stopRing(); micState = "idle";
    S.sess = null; micErr = ""; return render();
  }
  if (a === "retry") { S.sess.result = null; S.sess.pa = null; S.sess.said = ""; micErr = ""; return render(); }
  if (a === "nextw") return nextWarmup();
  if (a === "reveal") { S.sess.reveal = true; speak(S.sess.cur.example); return render(); }
  if (a === "proceed") return proceedTalk();
  if (a === "finish") return finishSession();
  if (a === "retrytalk") return talkStep(null);
  if (a === "tone") { P.tone = !P.tone; persist(); return render(); }
  if (a === "reset") { P.words = {}; P.missed = {}; P.log = []; P.gen = {}; persist(); return render(); }

  if (a === "savekeys") {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    P.azKey = g("azKey"); P.azRegion = g("azRegion") || "koreacentral";
    P.gmKey = g("gmKey"); P.gmModel = g("gmModel") || "gemini-3.6-flash";
    persist(); return toast("저장했습니다.");
  }
  if (a === "revdrill") {
    var list = Object.keys(P.missed).map(function (k) { return P.missed[k]; });
    S.sess = { si: -1, fresh: [], items: list, idx: 0, part: "warmup", said: "", pa: null,
      result: null, stage: "ask", turn: 0, history: [], cur: null, last: null, reveal: false, err: "" };
    micErr = ""; render();
    setTimeout(function () { speak(list[0].zh); }, 350);
    return;
  }
  if (a === "typed") {
    var box = document.getElementById("typed");
    var v = box && box.value.trim();
    if (!v || !S.sess) return;
    if (S.sess.part === "warmup") gradeTyped(v);
    else { S.sess.turn++; talkStep(v); }
  }
});

/* 누르고 있는 동안만 녹음 */
document.addEventListener("pointerdown", function (ev) {
  var t = ev.target.closest("[data-hold]");
  if (!t || t.disabled) return;
  ev.preventDefault();
  micPress(t.getAttribute("data-hold"));
});
window.addEventListener("pointerup", micRelease);
document.addEventListener("contextmenu", function (ev) {
  if (ev.target.closest && ev.target.closest("[data-hold]")) ev.preventDefault();
});
window.addEventListener("pointercancel", micRelease);
window.addEventListener("blur", micRelease);

document.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" && ev.target.id === "typed") {
    ev.preventDefault();
    var v = ev.target.value.trim();
    if (!v || !S.sess) return;
    if (S.sess.part === "warmup") gradeTyped(v);
    else { S.sess.turn++; talkStep(v); }
  }
});
document.addEventListener("input", function (ev) {
  if (ev.target.id === "tint") {
    P.tint = +ev.target.value; persist();
    document.documentElement.style.setProperty("--glass", 0.40 + (P.tint / 100) * 0.45);
    document.documentElement.style.setProperty("--edge", 0.55 + (P.tint / 100) * 0.35);
  }
});

/* ===================== 시작 ===================== */
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
}

Promise.all(["./data/hsk1-3_curriculum.json", "./data/hsk4_curriculum.json"].map(function (f) {
  return fetch(f).then(function (r) {
    if (!r.ok) throw new Error(f + " 를 찾을 수 없습니다");
    return r.json();
  });
})).then(function (phases) {
  CURRICULUM = { phases: phases };
  render();
}).catch(function (e) {
  document.getElementById("app").innerHTML =
    '<div class="screen"><div class="glass card"><p class="action-t">데이터를 불러오지 못했습니다</p>'
    + '<p class="sub">' + esc(e.message) + "</p>"
    + '<p class="foot">index.html 과 같은 폴더에 data/ 가 있어야 합니다. '
    + "파일을 직접 열지 말고 주소로 접속하세요.</p></div></div>";
});
</script>
</body>
</html>
